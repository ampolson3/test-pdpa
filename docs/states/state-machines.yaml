  - from: validating
    to: ready
    trigger: ตรวจทุกแถวเสร็จ (dry-run) พร้อมรายงานแถวที่ผิด
    event: import.validate
    guard: null
    action: เก็บไฟล์รายงานข้อผิดพลาด
  - from: validating
    to: failed
    trigger: อ่านไฟล์ไม่ได้ระหว่างตรวจ
    event: import.validate
    guard: null
    action: null
  - from: ready
    to: validating
    trigger: เปลี่ยนการจับคู่คอลัมน์แล้วตรวจใหม่
    event: set mapping
    guard: null
    action: enqueue import.validate
  - from: ready
    to: importing
    trigger: ผู้ใช้ยืนยันนำเข้า
    event: confirm
    guard: มีแถวที่ผ่านอย่างน้อย 1 แถว
    action: enqueue import.apply
  - from: importing
    to: done
    trigger: บันทึกแถวที่ผ่านทั้งหมดใน transaction เดียว
    event: import.apply
    guard: null
    action: audit
  - from: importing
    to: failed
    trigger: บันทึกแถวใดไม่สำเร็จ — ย้อนกลับทั้งหมด (rollback)
    event: import.apply
    guard: null
    action: audit
- machine: PLT-05#task
  title: Workflow task (PLT-05)
  column: platform.workflow_tasks.status
  states:
  - open
  - in_progress
  - done
  - cancelled
  initial:
  - open
  terminal:
  - done
  - cancelled
  transitions:
  - from: open
    to: in_progress
    trigger: ผู้รับงานเริ่มทำ (หรือรับงานของกลุ่มแล้วเริ่ม)
    event: PATCH workflow-tasks status=in_progress
    guard: ผู้รับงาน หรือผู้มีสิทธิ์แก้ไข record
    action: audit
  - from: in_progress
    to: open
    trigger: คืนสถานะยังไม่เริ่ม
    event: PATCH workflow-tasks status=open
    guard: ผู้รับงาน หรือผู้มีสิทธิ์แก้ไข record
    action: audit
  - from: open
    to: done
    trigger: instance ส่งต่อออกจากขั้นของงาน (outcome = ขั้นปลายทาง)
    event: transition
    guard: null
    action: audit
  - from: in_progress
    to: done
    trigger: instance ส่งต่อออกจากขั้นของงาน (outcome = ขั้นปลายทาง)
    event: transition
    guard: null
    action: audit
- machine: PLT-05#timer
  title: SLA timer (PLT-05)
  column: platform.sla_timers.status
  states:
  - running
  - met
  - breached
  - stopped
  initial:
  - running
  terminal:
  - met
  - breached
  - stopped
  transitions:
  - from: running
    to: met
    trigger: instance ถึงขั้นสุดท้ายก่อนครบกำหนด
    event: transition
    guard: null
    action: stopped_at
  - from: running
    to: breached
    trigger: ถึง due_at ขณะไม่หยุดนับ
    event: workflow.sla_tick
    guard: paused_at IS NULL
    action: escalated_at · แจ้งผู้รับงาน + ผู้รับการส่งต่อ · hook OnSLA(breached) · instance sla_status = overdue
- machine: PLT-08#version
  title: Record version (PLT-08)
  column: platform.record_versions.status
  states:
  - draft
  - in_review
  - approved
  - published
  - superseded
  initial:
  - draft
  terminal:
  - superseded
  transitions:
  - from: draft
    to: in_review
    trigger: ส่งขออนุมัติ
    event: submit
    guard: สิทธิ์แก้ไข record
    action: เปิดขั้นอนุมัติตาม policy · บันทึก diff · audit
  - from: in_review
    to: approved
    trigger: อนุมัติขั้นสุดท้าย
    event: decide approved
    guard: role ของขั้น · ไม่ใช่ผู้จัดทำ / ผู้ส่ง / ผู้อนุมัติขั้นก่อน
    action: แจ้งผู้ส่ง (approval.approved) · audit
  - from: in_review
    to: draft
    trigger: ส่งกลับแก้ไข หรือ ไม่อนุมัติ (ต้องมีเหตุผล)
    event: decide returned / rejected
    guard: role ของขั้น · ไม่ใช่ผู้จัดทำ / ผู้ส่ง / ผู้อนุมัติขั้นก่อน
    action: ลบขั้นที่ยังไม่ตัดสิน · แจ้งผู้ส่ง · audit
  - from: approved
    to: published
    trigger: เผยแพร่
    event: publish
    guard: สิทธิ์เผยแพร่
    action: ฉบับเผยแพร่เดิม → superseded · hook OnPublish · audit
  - from: published
    to: superseded
    trigger: มีเวอร์ชันใหม่เผยแพร่
    event: publish (เวอร์ชันถัดไป)
    guard: null
    action: null
- machine: PLT-08#approval
  title: Approval step (PLT-08)
  column: platform.approvals.decision
  states:
  - pending
  - approved
  - rejected
  - returned
  initial:
  - pending
  terminal:
  - approved
  - rejected
  - returned
  transitions:
  - from: pending
    to: approved
    trigger: ผู้อนุมัติของขั้นอนุมัติ
    event: decide
    guard: ขั้นก่อนหน้าอนุมัติแล้ว · maker-checker
    action: audit
  - from: pending
    to: returned
    trigger: ส่งกลับแก้ไข
    event: decide
    guard: มีเหตุผล · maker-checker
    action: audit
  - from: pending
    to: rejected
    trigger: ไม่อนุมัติ
    event: decide
    guard: มีเหตุผล · maker-checker
    action: audit

