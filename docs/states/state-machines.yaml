# State machines (generated from the SA pack; the same values as the CHECK constraints in backend/db/migrations)
# transitions from/to [*] (initial / final pseudo-states) are omitted; see `initial` and `terminal`.
# (from, to) pairs are the allow-list. `event` / `guard` / `action` are split from the diagram label (event [guard] / action);
# they are descriptive (often Thai) — name the Go methods yourself and cover every guard with a test.
machines:
- machine: ST-01#1
  title: Consent status
  column: consent.consent_status.status
  states:
  - PENDING
  - ACTIVE
  - NOT_GIVEN
  - WITHDRAWN
  - EXPIRED
  initial:
  - PENDING
  - ACTIVE
  - NOT_GIVEN
  terminal: []
  transitions:
  - from: PENDING
    to: ACTIVE
    trigger: CONFIRMED
    event: CONFIRMED
    guard: null
    action: null
  - from: ACTIVE
    to: PENDING
    trigger: purpose version material + requires_reconsent
    event: purpose version material + requires_reconsent
    guard: null
    action: null
  - from: PENDING
    to: NOT_GIVEN
    trigger: CANCELLED [หมดเวลา / ปฏิเสธ]
    event: CANCELLED
    guard: หมดเวลา / ปฏิเสธ
    action: null
  - from: NOT_GIVEN
    to: ACTIVE
    trigger: CONSENTED
    event: CONSENTED
    guard: null
    action: null
  - from: ACTIVE
    to: WITHDRAWN
    trigger: WITHDRAWN
    event: WITHDRAWN
    guard: null
    action: null
  - from: WITHDRAWN
    to: ACTIVE
    trigger: CONSENTED (ให้ใหม่)
    event: CONSENTED (ให้ใหม่)
    guard: null
    action: null
  - from: ACTIVE
    to: EXPIRED
    trigger: EXPIRED [now ≥ expires_at] / job expiry_sweep
    event: EXPIRED
    guard: now ≥ expires_at
    action: job expiry_sweep
  - from: EXPIRED
    to: ACTIVE
    trigger: CONSENTED / EXTENDED
    event: CONSENTED / EXTENDED
    guard: null
    action: null
  - from: ACTIVE
    to: ACTIVE
    trigger: EXTENDED · CHANGED_PREFERENCES
    event: EXTENDED · CHANGED_PREFERENCES
    guard: null
    action: null
