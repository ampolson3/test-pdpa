# RBAC matrix — source: Development Plan sheet Roles_Permissions (ต้องยืนยันกับลูกค้าใน T06)
# seed: backend/db/migrations/00019_seed_iam_permissions.sql · change = new migration + update this file + OpenAPI x-permission
version: 1
actions:
  C: create
  R: read
  U: update
  D: delete
  A: approve
  P: publish
  E: export
  X: execute
x_permission_format: <area>.<resource>.<action>  e.g. consent.purpose.approve (area is the RBAC area, not the Go package)
roles:
- code: SUPER
  name: Platform Super Admin
  description: 'ผู้ให้บริการแพลตฟอร์ม: tenant แพ็กเกจ และค่าระบบ ไม่เห็นข้อมูลธุรกิจของ tenant เว้นแต่ใช้ break-glass (IAM-07)'
  default_scope: ทั้งแพลตฟอร์ม
  mfa_required: true
- code: ORGADMIN
  name: Organization Admin
  description: 'ผู้ดูแลระบบขององค์กร: ผู้ใช้ role โครงสร้างองค์กร SSO และการตั้งค่า'
  default_scope: ทั้ง tenant
  mfa_required: true
- code: DPO
  name: DPO
  description: เจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล ดูแลทุกโมดูลและเป็นผู้อนุมัติหลัก
  default_scope: tenant / บริษัทที่ได้รับมอบหมาย
  mfa_required: true
- code: PRIVACY
  name: Privacy Team
  description: ทีมงาน DPO ปฏิบัติงานประจำ แต่ไม่อนุมัติขั้นสุดท้าย
  default_scope: บริษัทที่ได้รับมอบหมาย
  mfa_required: true
- code: LEGAL
  name: Legal
  description: 'ฝ่ายกฎหมาย: ประกาศ template สัญญา DPA/DSA'
  default_scope: ทั้ง tenant
  mfa_required: false
- code: OWNER
  name: Process Owner / Champion
  description: เจ้าของกระบวนการหรือผู้ประสานงาน PDPA ของแผนก ดูแล RoPA และตอบแบบสอบถาม
  default_scope: แผนกของตนเอง
  mfa_required: false
- code: IT
  name: System Owner / IT
  description: 'เจ้าของระบบ/IT: asset, data discovery, งานย่อยของคำขอ, ติดตั้ง script, connector'
  default_scope: ระบบ/แผนกที่ได้รับมอบหมาย
  mfa_required: false
- code: MKT
  name: Marketing / Business
  description: 'การตลาด/ธุรกิจ: Purpose, Collection Point และแคมเปญขอความยินยอม'
  default_scope: แผนก/แบรนด์ของตนเอง
  mfa_required: false
- code: FRONT
  name: Front Staff
  description: 'พนักงานหน้าร้าน/Call center: บันทึกความยินยอมแทนลูกค้าและรับคำขอใช้สิทธิ'
  default_scope: สาขา/ทีมของตนเอง
  mfa_required: false
- code: SEC
  name: Security / Incident
  description: 'ทีมความปลอดภัย: เหตุละเมิดและประเมินมาตรการความปลอดภัย'
  default_scope: ทั้ง tenant
  mfa_required: true
- code: PROC
  name: Procurement / Vendor Manager
  description: 'จัดซื้อ/ผู้ดูแลคู่ค้า: ทะเบียนและการประเมินคู่ค้า'
  default_scope: คู่ค้าที่ตนดูแล
  mfa_required: false
- code: AUDIT
  name: Auditor
  description: ผู้ตรวจสอบภายใน/ภายนอก ดูและส่งออกได้อย่างเดียว
  default_scope: ทั้ง tenant (อ่านอย่างเดียว)
  mfa_required: true
- code: EXEC
  name: Executive
  description: 'ผู้บริหาร: dashboard รายงาน และยอมรับความเสี่ยง'
  default_scope: ทั้ง tenant (สรุป)
  mfa_required: false
- code: EMP
  name: Employee
  description: 'พนักงานทั่วไป: แจ้งเหตุ อบรม รับทราบนโยบาย ขอคำปรึกษา'
  default_scope: ข้อมูลของตนเอง
  mfa_required: false
- code: GUEST
  name: External Guest
  description: คู่ค้า ผู้ประมวลผล หรือผู้ร่วมประเมินภายนอก เข้าผ่าน magic link (IAM-04)
  default_scope: เฉพาะงานที่ได้รับเชิญ
  mfa_required: false
- code: API
  name: API Client
  description: บัญชีระบบสำหรับเชื่อมต่อ (CRM, POS, แอป) ใช้สิทธิ์ตาม scope
  default_scope: ระบบที่ผูกไว้
  mfa_required: false
