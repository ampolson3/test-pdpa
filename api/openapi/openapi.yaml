openapi: 3.1.0
info:
  title: PDPA Management Platform API
  version: 0.1.0
  summary: Contract base shared by all surfaces (admin, portal, public, api, scim, webhooks)
  description: |
    Source of truth for the Go handlers (oapi-codegen) and the TypeScript client (openapi-typescript).
    Conventions are in api/openapi/README.md. Every operation must declare `x-permission`
    (`<area>.<resource>.<action>` from docs/security/permissions.yaml, or `public`, `authenticated`, `scim`, `webhook`)
    and `x-module` (the owning Go module / PostgreSQL schema).
    The three operations below are reference examples; add the rest feature by feature.
servers:
  - url: https://api.pdpa.example
    description: Placeholder — the real host is per environment
tags:
  - name: iam
    description: Users, roles, permissions, sessions (backend/internal/iam)
  - name: consent
    description: Purposes, collection points, consent transactions (backend/internal/consent)
  - name: platform
    description: Platform services — background jobs, files, notifications, ... (backend/internal/platform/<service>)
paths:
  /admin/v1/me:
    get:
      operationId: iamGetMe
      tags: [iam]
      summary: Current user, effective permissions and data scopes
      description: Called by the admin BFF after login (SEQ-01). Result is cached per user in Valkey for 60 seconds.
      x-permission: authenticated
      x-module: iam
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 01925f3c-7b8e-7c3a-9d51-2f0c6e1a4b77
                display_name: สมศรี ใจดี
                email_masked: so****@example.co.th
                locale: th
                tenant:
                  id: 01925f3c-0000-7000-8000-000000000001
                  code: acme
                  name: บริษัท ตัวอย่าง จำกัด
                roles: [DPO]
                permissions: [ropa.activity.read, ropa.activity.approve, dsar.request.read]
                scopes:
                  - scope_type: legal_entity
                    legal_entity_id: 01925f3c-0000-7000-8000-0000000000a1
                    org_unit_id: null
                    include_descendants: true
                mfa_enrolled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/jobs:
    get:
      operationId: platformListJobs
      tags: [platform]
      summary: Background jobs of the current tenant (PLT-10 job-status page)
      description: |
        Lists River jobs whose args carry the caller's tenant_id — newest first. Platform-wide jobs
        (no tenant_id) are never listed here; the provider console will show those. Finished jobs are
        kept 24 hours (completed), 24 hours (cancelled) or 7 days (discarded) before River removes them.
      x-permission: admin.job.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          description: Only jobs in these states
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobState'
        - name: kind
          in: query
          required: false
          description: Only jobs of this kind (e.g. `outbox.dispatch`)
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: One page of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
              example:
                data:
                  - id: 18342
                    kind: outbox.dispatch
                    queue: default
                    state: retryable
                    attempt: 2
                    max_attempts: 25
                    created_at: '2026-09-25T03:15:00Z'
                    scheduled_at: '2026-09-25T03:15:17Z'
                    attempted_at: '2026-09-25T03:15:01Z'
                    finalized_at: null
                    last_error: 'webhook endpoint returned 503'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/platform/files:
    post:
      operationId: platformUploadFile
      tags: [platform]
      summary: Upload a file (PLT-09)
      description: |
        Stores the file and queues its ClamAV scan; the file is downloadable only once `av_status` is `clean`.
        Size and type are checked against the file's content, not the declared type. An upload that is not
        attached to a record by the owning module within 24 hours is deleted. Only the uploader can see an
        unattached file.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored; scan pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
              example:
                id: 01925f3c-7b8e-7c3a-9d51-2f0c6e1a4b99
                file_name: หนังสือมอบอำนาจ.pdf
                mime_type: application/pdf
                size_bytes: 182044
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                av_status: pending
                created_at: '2026-09-25T03:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File larger than the configured limit (`files.too_large`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: File type not allowed (`files.type_not_allowed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/v1/platform/files/{id}:
    get:
      operationId: platformGetFile
      tags: [platform]
      summary: File metadata and scan status
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/files/{id}/download:
    get:
      operationId: platformDownloadFile
      tags: [platform]
      summary: Redirect to a short-lived signed download URL (SEQ-07)
      description: |
        302 to a pre-signed object-storage URL that expires after 5 minutes (configurable) and always downloads
        as an attachment. 409 while the scan is pending (`files.scan_pending`), for an infected file
        (`files.infected`) or a failed scan (`files.scan_failed`). Visibility: the uploader while unattached;
        once attached, users holding the permission the owning module registered for that record type.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: Signed URL
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/v1/platform/notification-templates:
    get:
      operationId: platformListNotificationTemplates
      tags: [platform]
      summary: Notification templates visible to the tenant (its own and the platform's global ones)
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: platformCreateNotificationTemplate
      tags: [platform]
      summary: Create a tenant template (or override a global one with the same code, channel and language)
      x-permission: admin.notification.create
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplateInput'
            example:
              code: dsar.received
              channel: email
              language: th
              subject: ได้รับคำขอ {{.request_no}}
              body: เรียน {{.name}} เราได้รับคำขอ {{.request_no}} แล้ว
              variables: [name, request_no]
      responses:
        '201':
          description: Created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/notification-templates/preview:
    post:
      operationId: platformPreviewNotificationTemplate
      tags: [platform]
      summary: Render a template with sample values (declared variables not given show as {name})
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                body:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Rendered
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  subject:
                    type: string
                  body:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/notification-templates/{id}:
    get:
      operationId: platformGetNotificationTemplate
      tags: [platform]
      summary: One template
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The template
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: platformUpdateNotificationTemplate
      tags: [platform]
      summary: Change subject, body and variables of a tenant template (global templates are read-only)
      x-permission: admin.notification.update
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                body:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      operationId: platformDeleteNotificationTemplate
      tags: [platform]
      summary: Delete a tenant template
      x-permission: admin.notification.delete
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/v1/platform/notifications:
    get:
      operationId: platformListNotifications
      tags: [platform]
      summary: Delivery log — status of every message, newest first (PLT-04)
      description: Recipients are masked; message text and variables are never returned.
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/platform/notifications/{id}:
    get:
      operationId: platformGetNotification
      tags: [platform]
      summary: Delivery status of one message
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The message's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/inbox:
    get:
      operationId: platformGetInbox
      tags: [platform]
      summary: The signed-in user's in-app notifications and unread count (the bell)
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/inbox/stream:
    get:
      operationId: platformStreamInbox
      tags: [platform]
      summary: Server-sent events with the unread count whenever it changes
      description: |
        `text/event-stream`; each event is `event: unread` with data `{"unread": <n>}`, sent on connect and on
        every change (checked every few seconds), plus a comment line as keep-alive. Reconnect with EventSource.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/inbox/{id}/read:
    post:
      operationId: platformMarkInboxRead
      tags: [platform]
      summary: Mark one of the user's own in-app notifications read
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Marked read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/records/{entityType}/{entityId}/comments:
    get:
      operationId: platformListComments
      tags: [platform]
      summary: Comments of a record, oldest first (PLT-07)
      description: Allowed when the record type is registered by its module and the caller holds that module's read (list) or write (post) permission for it — deny by default (PLT-07).
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: platformCreateComment
      tags: [platform]
      summary: Comment on a record, or reply (parent_id); @mentions notify their users
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
                  description: 'Mentions are written as @[Display name](user-id)'
                parent_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/records/{entityType}/{entityId}/attachments:
    get:
      operationId: platformListAttachments
      tags: [platform]
      summary: Files attached to a record
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: platformAttachFile
      tags: [platform]
      summary: Attach a file the caller uploaded (POST /admin/v1/platform/files) to a record
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/records/{entityType}/{entityId}/activity:
    get:
      operationId: platformListActivity
      tags: [platform]
      summary: Activity timeline of a record (its audit trail), newest first
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/comments/{id}:
    patch:
      operationId: platformUpdateComment
      tags: [platform]
      summary: Edit your own comment
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: platformDeleteComment
      tags: [platform]
      summary: Delete your own comment (not one with replies)
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/v1/platform/comments/{id}/resolve:
    post:
      operationId: platformResolveComment
      tags: [platform]
      summary: Mark a comment thread resolved, or open it again
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              properties:
                resolved:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/mentionable-users:
    get:
      operationId: platformSearchMentionableUsers
      tags: [platform]
      summary: Active users of the tenant matching a name prefix, for the @mention picker (names only)
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 60
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, display_name]
                      properties:
                        id:
                          $ref: '#/components/schemas/Uuid'
                        display_name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/v1/collection-points/{key}:
    get:
      operationId: consentGetPublicCollectionPoint
      tags: [consent]
      summary: Collection point configuration for a consent form (no login)
      description: |
        Tenant is resolved from `key` through platform.public_keys before the tenant transaction starts (ADR-19).
        Returns the latest active purpose versions and the linked notice (BP-01 step t1–t2). Cacheable for 60 seconds.
      x-permission: public
      x-module: consent
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: Public key of the collection point (random, at least 128 bits, base64url)
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,64}$'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Collection point with its purposes
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollectionPoint'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/consents:
    post:
      operationId: consentSubmitConsents
      tags: [consent]
      summary: Record consent decisions from a channel system (CRM / POS / app)
      description: |
        SEQ-04. One receipt per call, one consent transaction per purpose decision, consent status projection updated and
        `consent.*` events written to the outbox in the same transaction. Replaying the same Idempotency-Key with the same
        body returns the stored status and body (201) with `Idempotent-Replayed: true`.
      x-permission: consent.record.create
      x-module: consent
      security:
        - clientCredentials: [consent.record.create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSubmission'
            example:
              collection_point_code: CRM-MEMBER
              subject:
                identifiers:
                  - type: email
                    value: customer@example.com
              decisions:
                - purpose_code: MARKETING-EMAIL
                  purpose_version_no: 3
                  decision: CONSENTED
                  preferences:
                    frequency: weekly
                - purpose_code: PROFILING
                  purpose_version_no: 1
                  decision: NOT_CONSENTED
              language: th
              occurred_at: '2026-09-25T03:15:00Z'
      responses:
        '201':
          description: Recorded (also returned, with Idempotent-Replayed, when an identical request is replayed)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token attached server-side by the admin BFF. Browsers never hold it.
    portalToken:
      type: http
      scheme: bearer
      description: Short-lived token issued by the API after OTP / ThaID verification (idle 30 minutes), kept by the portal BFF.
    guestToken:
      type: http
      scheme: bearer
      description: Session issued after a guest link token plus e-mail OTP; bound to one task (IAM-04).
    clientCredentials:
      type: oauth2
      description: OAuth2 client credentials via Keycloak (single realm, tenant in the `tid` claim — decisions Q-18), access token at most 15 minutes. Scopes are permission codes (decisions Q-10).
      flows:
        clientCredentials:
          tokenUrl: https://auth.pdpa.example/realms/pdpa/protocol/openid-connect/token
          scopes:
            consent.record.create: Record consent decisions
            consent.record.read: Read consent status of data subjects
            dsar.request.create: Submit data subject requests
            breach.incident.create: Report incidents (SIEM)
    scimBearer:
      type: http
      scheme: bearer
      description: SCIM 2.0 bearer token per tenant
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 't=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + body)>; reject if older than 5 minutes'
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: Record type registered by its module (e.g. notification_template, dsar_request)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,59}$'
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended). Kept 24 hours per tenant and principal. Missing → 428 (the validator maps it).
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (row_version) of the resource being modified. Mismatch → 412, missing → 428.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields; prefix with `-` for descending (e.g. `-created_at`)
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of messages and localized fields (default th)
      schema:
        type: string
        enum: [th, en]
        default: th
  headers:
    ETag:
      description: Current row_version of the resource
      schema:
        type: string
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier request with the same Idempotency-Key
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or schema validation failure (`request.invalid`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials (`authn.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (`authz.denied`) — also written to iam.security_events
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible in this tenant / scope (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state (`<module>.invalid_transition`, `idempotency.in_progress`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current row_version (`conflict.version_mismatch`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required Idempotency-Key or If-Match header missing (`precondition.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business rule violation (`<module>.<rule>`, `idempotency.key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Comment:
      type: object
      required: [id, author_id, author_name, body, mentions, resolved, row_version, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        author_id:
          $ref: '#/components/schemas/Uuid'
        author_name:
          type: string
        body:
          type: string
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        resolved:
          type: boolean
        row_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Attachment:
      type: object
      required: [id, file_name, mime_type, size_bytes, av_status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        av_status:
          type: string
          enum: [pending, clean, infected, error]
        uploader_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Activity:
      type: object
      required: [id, occurred_at, actor_type, action]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor_type:
          type: string
        actor_name:
          type: string
        action:
          type: string
        before:
          type: [object, 'null']
        after:
          type: [object, 'null']
    NotificationChannel:
      type: string
      enum: [email, sms, line, in_app]
    NotificationStatus:
      type: string
      enum: [queued, sent, delivered, failed, cancelled]
    NotificationTemplateInput:
      type: object
      required: [code, channel, language, body]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_.]{1,79}$'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
          enum: [th, en]
        subject:
          type: string
        body:
          type: string
          description: text/template syntax, e.g. {{.request_no}}; every variable used must be declared
        variables:
          type: array
          items:
            type: string
    NotificationTemplate:
      type: object
      required: [id, global, code, channel, language, body, variables, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        global:
          type: boolean
          description: A platform template (read-only for tenants; override it by creating your own)
        code:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    NotificationDelivery:
      type: object
      required: [id, channel, status, attempts, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_code:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recipient_masked:
          type: string
          description: Masked address, e.g. so****@example.co.th (empty for user recipients)
        status:
          $ref: '#/components/schemas/NotificationStatus'
        attempts:
          type: integer
        provider_message_id:
          type: string
        sent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: string
          description: Last failure, with addresses and numbers removed
        entity_type:
          type: string
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Inbox:
      type: object
      required: [unread, items]
      properties:
        unread:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [id, title, body, read, created_at]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              title:
                type: string
              body:
                type: string
              read:
                type: boolean
              created_at:
                $ref: '#/components/schemas/Timestamp'
    StoredFile:
      type: object
      required: [id, file_name, mime_type, size_bytes, sha256, av_status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        av_status:
          type: string
          enum: [pending, clean, infected, error]
        entity_type:
          type: [string, 'null']
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    JobState:
      type: string
      description: River job state
      enum: [available, cancelled, completed, discarded, pending, retryable, running, scheduled]
    Job:
      type: object
      description: One background job. Args are not exposed — they carry identifiers only.
      required: [id, kind, queue, state, attempt, max_attempts, created_at, scheduled_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        queue:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        attempt:
          type: integer
          description: Attempts made so far
        max_attempts:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        scheduled_at:
          $ref: '#/components/schemas/Timestamp'
        attempted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finalized_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_error:
          type: [string, 'null']
          maxLength: 500
          description: Message of the most recent failed attempt (truncated), null if none
    JobList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: [string, 'null']
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the API
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, e.g. 2026-09-25T03:15:00Z
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://docs.pdpa.example/problems/consent.purpose_inactive
        title:
          type: string
          example: Purpose is not active
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: '^[a-z_]+(\.[a-z_]+)+$|^[a-z_]+$'
          example: consent.purpose_inactive
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: decisions[0].purpose_code
        code:
          type: string
          example: required
        message:
          type: string
    Me:
      type: object
      required: [id, display_name, locale, tenant, roles, permissions, scopes, mfa_enrolled]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        email_masked:
          type: string
        locale:
          type: string
          enum: [th, en]
        tenant:
          type: object
          required: [id, code, name]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            code:
              type: string
            name:
              type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          description: Effective permission codes (x-permission values)
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/DataScope'
        mfa_enrolled:
          type: boolean
    DataScope:
      type: object
      required: [scope_type]
      properties:
        scope_type:
          type: string
          enum: [tenant, legal_entity, org_unit, self]
        legal_entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        org_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        include_descendants:
          type: boolean
    PublicCollectionPoint:
      type: object
      required: [code, name, channel, purposes, double_opt_in, verification_method]
      properties:
        code:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [web, app, pos, call_center, kiosk, paper, line, api, import, cookie]
        verification_method:
          type: string
          enum: [none, otp, magic_link, idp]
        double_opt_in:
          type: boolean
        age_gate:
          type: boolean
          description: Ask for age / guardian before consent (ม.20); minimum ages are per purpose (min_age)
        notice:
          type: [object, 'null']
          properties:
            slug:
              type: string
            version_no:
              type: integer
            url:
              type: string
              format: uri
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/PublicPurpose'
    PublicPurpose:
      type: object
      required: [code, version_no, name, text, is_sensitive, requires_explicit]
      properties:
        code:
          type: string
        version_no:
          type: integer
        name:
          type: string
        text:
          type: string
          description: Consent text of this version in the requested language (sanitized HTML)
        is_sensitive:
          type: boolean
        requires_explicit:
          type: boolean
        min_age:
          type: [integer, 'null']
        preferences:
          type: array
          items:
            type: object
            required: [code, name, pref_type]
            properties:
              code:
                type: string
              name:
                type: string
              pref_type:
                type: string
                enum: [channel, topic, frequency, other]
              options:
                type: array
                description: From consent.purpose_preferences.options
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value:
                      type: string
                    label:
                      type: string
    SubjectIdentifier:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [email, phone, national_id, customer_id, passport, line_uid, other]
        value:
          type: string
          description: Normalized by the API (lower-case e-mail, E.164 phone) before blind indexing. Never logged.
          writeOnly: true
    ConsentSubmission:
      type: object
      required: [collection_point_code, subject, decisions]
      properties:
        collection_point_code:
          type: string
        subject:
          type: object
          required: [identifiers]
          properties:
            identifiers:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubjectIdentifier'
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            required: [purpose_code, purpose_version_no, decision]
            properties:
              purpose_code:
                type: string
              purpose_version_no:
                type: integer
                description: Version shown to the data subject; must be the active version or the request is rejected with consent.purpose_version_stale
              decision:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN]
              preferences:
                type: object
                additionalProperties: true
        language:
          type: string
          enum: [th, en]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ConsentResult:
      type: object
      required: [receipt_no, subject_ref, transactions]
      properties:
        receipt_no:
          type: string
        subject_ref:
          $ref: '#/components/schemas/Uuid'
        transactions:
          type: array
          items:
            type: object
            required: [id, purpose_code, transaction_type, status]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              purpose_code:
                type: string
              transaction_type:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN, EXPIRED, EXTENDED, PENDING, CONFIRMED, CANCELLED, CHANGED_PREFERENCES]
              status:
