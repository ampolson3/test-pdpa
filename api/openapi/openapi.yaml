        name: ระบบ HRIS
        asset_type: application
        hosting_country_code: TH
        hosting_type: cloud
    Asset:
      type: object
      required: [id, name, asset_type, status, row_version, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        asset_type: {$ref: '#/components/schemas/AssetType'}
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
        provider_party_id: {$ref: '#/components/schemas/Uuid'}
        hosting_country_code: {type: string}
        hosting_type: {$ref: '#/components/schemas/AssetHostingType'}
        classification: {$ref: '#/components/schemas/AssetClassification'}
        status: {type: string, enum: [active, retired]}
        row_version: {type: integer}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    VendorStatus:
      type: string
      description: ST-06. VEN-01 only ever creates prospect — every other transition belongs to a sibling feature (VEN-02/05/07/08/09/14) not built yet.
      enum: [prospect, onboarding, approved, conditional, rejected, offboarding, terminated]
    VendorTier:
      type: string
      enum: [low, medium, high, critical]
    VendorInput:
      type: object
      required: [party_id, service_description]
      properties:
        party_id: {$ref: '#/components/schemas/Uuid', description: The external party (ORG-06) this vendor extends — one vendor row per party}
        service_description: {type: string, minLength: 1, maxLength: 2000}
        relationship_owner_id: {$ref: '#/components/schemas/Uuid', description: The internal staff member who owns this relationship}
        is_processor: {type: boolean, default: true}
        data_access:
          description: Free-form notes on what data this vendor can access — no fixed shape yet (ม.40)
          type: object
          additionalProperties: true
        processing_countries:
          type: array
          items: {type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2}
          default: []
      example:
        party_id: 00000000-0000-0000-0000-000000000000
        service_description: ระบบประมวลผลเงินเดือนบนคลาวด์
        is_processor: true
        processing_countries: [TH]
    Vendor:
      type: object
      required: [id, party_id, service_description, is_processor, status, data_access, processing_countries, row_version, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        party_id: {$ref: '#/components/schemas/Uuid'}
        service_description: {type: string}
        relationship_owner_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        is_processor: {type: boolean}
        tier:
          oneOf: [{$ref: '#/components/schemas/VendorTier'}, {type: 'null'}]
        data_access:
          type: object
          additionalProperties: true
        processing_countries:
          type: array
          items: {type: string}
        status: {$ref: '#/components/schemas/VendorStatus'}
        next_assessment_at: {type: [string, 'null'], format: date}
        approved_at: {type: [string, 'null'], format: date-time}
        offboarded_at: {type: [string, 'null'], format: date-time}
        row_version: {type: integer}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    VendorIntakeInput:
      type: object
      required: [answers]
      properties:
        answers:
          description: Answers to the published "intake" form's questions (VEN-02) — data_volume, sensitive_data, system_access_level, cross_border_transfer by default
          type: object
          additionalProperties: true
      example:
        answers: {data_volume: medium, sensitive_data: 'no', system_access_level: read_write, cross_border_transfer: 'no'}
    VendorIntake:
      type: object
      required: [id, vendor_id, form_submission_id, inherent_score, tier_result, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        form_submission_id: {$ref: '#/components/schemas/Uuid'}
        inherent_score: {type: number}
        tier_result: {$ref: '#/components/schemas/VendorTier'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    VendorIntakeResult:
      type: object
      required: [intake, required_assessment_codes]
      properties:
        intake: {$ref: '#/components/schemas/VendorIntake'}
        required_assessment_codes:
          description: VEN-04's assessment template codes (vendor_pdpa/vendor_security/vendor_transfer) this tier now calls for
          type: array
          items: {type: string}
    VendorRecordAssessmentInput:
      type: object
      required: [template_code, answers]
      properties:
        template_code:
          description: One of VEN-04's own seeded assessment_type=vendor template codes (e.g. vendor_pdpa, vendor_security, vendor_transfer)
          type: string
        answers:
          description: Answers to that template's published form questions
          type: object
          additionalProperties: true
      example:
        template_code: vendor_pdpa
        answers: {has_dpo: 'yes', has_retention_policy: 'yes', has_breach_process: 'no', has_subprocessor_list: 'yes', has_dpa_signed: 'yes'}
    VendorAssessment:
      type: object
      required: [id, vendor_id, assessment_id, cycle_no, score, residual_level, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        assessment_id: {$ref: '#/components/schemas/Uuid'}
        cycle_no: {type: integer}
        submitted_at: {$ref: '#/components/schemas/Timestamp'}
        score: {type: number}
        residual_level:
          type: string
          enum: [low, medium, high, critical]
        decision:
          type: [string, 'null']
          description: Set once VEN-08 records a decision on this cycle
          enum: [approved, conditional, rejected, null]
        decided_by: {$ref: '#/components/schemas/Uuid'}
        decided_at: {$ref: '#/components/schemas/Timestamp'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    VendorDecideAssessmentInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, conditional, rejected]
        remediation_items:
          type: array
          description: Required and non-empty when decision=conditional (VEN-08's own acceptance criterion) — ignored otherwise
          items:
            type: object
            required: [title, severity]
            properties:
              title: {type: string, minLength: 1, maxLength: 2000}
              severity: {type: string, enum: [low, medium, high]}
              due_at: {type: string, format: date}
      example:
        decision: conditional
        remediation_items:
          - title: ต้องส่งหลักฐานการเข้ารหัสข้อมูลที่พักไว้ (at rest) เพิ่มเติม
            severity: high
            due_at: '2026-12-31'
    VendorRemediationItem:
      type: object
      required: [id, vendor_id, title, severity, status, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        vendor_assessment_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        title: {type: string}
        severity: {type: string, enum: [low, medium, high]}
        due_at:
          oneOf: [{type: string, format: date}, {type: 'null'}]
        status: {type: string, enum: [open, in_progress, done, accepted_risk]}
        closed_at: {$ref: '#/components/schemas/Timestamp'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    VendorCertificate:
      type: object
      required: [id, vendor_id, cert_type, file_id, row_version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        cert_type: {type: string, maxLength: 40}
        issuer: {type: [string, 'null']}
        file_id: {$ref: '#/components/schemas/Uuid'}
        valid_from: {type: [string, 'null'], format: date}
        valid_to: {type: [string, 'null'], format: date}
        verified_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    VendorCertificateInput:
      type: object
      required: [cert_type, file_id]
      properties:
        cert_type: {type: string, maxLength: 40}
        issuer: {type: string}
        file_id: {$ref: '#/components/schemas/Uuid'}
        valid_from: {type: string, format: date}
        valid_to:
          description: Schedules this feature's own expiry-reminder checkpoint (VEN-06)
          type: string
          format: date
    VendorSubProcessor:
      type: object
      required: [id, vendor_id, party_id, service, countries, status, row_version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        party_id: {$ref: '#/components/schemas/Uuid'}
        service: {type: string, maxLength: 2000}
        countries:
          type: array
          items: {type: string, minLength: 2, maxLength: 2}
        status: {type: string, enum: [pending, approved, rejected]}
        approved_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        approved_at: {type: [string, 'null'], format: date-time}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    VendorSubProcessorInput:
      type: object
      required: [party_id, service]
      properties:
        party_id: {$ref: '#/components/schemas/Uuid'}
        service: {type: string, maxLength: 2000}
        countries:
          type: array
          items: {type: string, minLength: 2, maxLength: 2}
    VendorSubProcessorDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approved, rejected]}
    VendorDecideAssessmentResult:
      type: object
      required: [assessment, remediation_items]
      properties:
        assessment: {$ref: '#/components/schemas/VendorAssessment'}
        remediation_items:
          type: array
          items: {$ref: '#/components/schemas/VendorRemediationItem'}
    VendorOffboardingInput:
      type: object
      required: [data_return_status]
      additionalProperties: false
      properties:
        data_return_status:
          type: string
          enum: [pending, returned, destroyed, not_applicable]
        destruction_certificate_file_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        access_revoked:
          type: boolean
          description: Set true once every access credential/API key this vendor held has been revoked;
            the acceptance criterion's other half alongside the destruction certificate.
    VendorOffboarding:
      type: object
      required: [id, vendor_id, data_return_status, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        data_return_status:
          type: string
          enum: [pending, returned, destroyed, not_applicable]
        destruction_certificate_file_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        access_revoked_at: {$ref: '#/components/schemas/Timestamp'}
        completed_at: {$ref: '#/components/schemas/Timestamp'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AgreementType:
      type: string
      description: 'agreement.agreements'' own CHECK constraint — ''dpa'' (DPA-02) and ''dsa'' (DSA-04) are wired to CreateWizard; joint_controller/inbound_dpa are real values for when those modules exist.'
      enum: [dpa, dsa, joint_controller, inbound_dpa]
    AgreementCreateInput:
      type: object
      required: [agreement_type, our_role, legal_entity_id, title]
      description: 'For agreement_type=dpa, give vendor_id (the counterparty role is derived from our_role). For agreement_type=dsa (DSA-04), give counterparty_party_id + counterparty_role instead — a DSA counterparty need not be a tracked VEN-01 vendor.'
      properties:
        agreement_type: {$ref: '#/components/schemas/AgreementType'}
        our_role:
          type: string
          enum: [controller, processor, joint_controller]
          description: Our own role under this agreement — for agreement_type=dpa the counterparty's role is derived (controller <-> processor, joint_controller <-> joint_controller)
        vendor_id: {$ref: '#/components/schemas/Uuid', description: 'agreement_type=dpa only — the VEN-01 vendor this agreement is with; its own party_id becomes the counterparty'}
        counterparty_party_id: {$ref: '#/components/schemas/Uuid', description: 'agreement_type=dsa only — any ORG-06 external party this agreement is with'}
        counterparty_role:
          type: string
          enum: [disclosing, receiving, joint_controller, controller, processor]
          description: 'agreement_type=dsa only — the counterparty''s own role on the agreement'
        legal_entity_id: {$ref: '#/components/schemas/Uuid', description: Our own legal entity (ORG-01), for the document's merge fields}
        activity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          default: []
          description: RoPA processing activities this agreement covers
        template_id: {$ref: '#/components/schemas/Uuid', description: 'A published agreement template (DPA-01) to start the document from; omit for "โหมดกรอกเอง" (manual mode, a blank document)'}
        title: {type: string, minLength: 1, maxLength: 300}
        effective_from: {type: string, format: date}
        auto_renew: {type: boolean, default: false}
        renewal_notice_days: {type: integer, minimum: 0, default: 60}
      example:
        agreement_type: dpa
        our_role: controller
        vendor_id: 00000000-0000-0000-0000-000000000000
        legal_entity_id: 00000000-0000-0000-0000-000000000000
        activity_ids: []
        title: ข้อตกลงการประมวลผลข้อมูลส่วนบุคคลกับผู้ให้บริการระบบเงินเดือน
    Agreement:
      type: object
      required: [id, agreement_type, agreement_no, title, our_role, counterparty_id, document_id, status,
        auto_renew, renewal_notice_days, activity_ids, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        agreement_type: {$ref: '#/components/schemas/AgreementType'}
        agreement_no: {type: string}
        title: {type: string}
        our_role:
          type: string
          enum: [controller, processor, joint_controller]
        counterparty_id: {$ref: '#/components/schemas/Uuid'}
        vendor_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        template_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        document_id: {$ref: '#/components/schemas/Uuid', description: 'The PLT-16 document this agreement wraps — edit/export/publish through /admin/v1/platform/documents/{document_id}'}
        status:
          type: string
          enum: [draft, in_review, approved, out_for_signature, active, expired, terminated]
        effective_from:
          type: [string, 'null']
          format: date
        effective_to:
          type: [string, 'null']
          format: date
        auto_renew: {type: boolean}
        renewal_notice_days: {type: integer}
        activity_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AgreementScheduleInput:
      type: object
      required: [renewal_notice_days]
      properties:
        effective_from:
          type: [string, 'null']
          format: date
        effective_to:
          description: DPA-10's own end date — the renewal reminder (agreement.renewal_reminder) is scheduled renewal_notice_days before this
          type: [string, 'null']
          format: date
        auto_renew: {type: boolean, default: false}
        renewal_notice_days: {type: integer, minimum: 0}
      example:
        effective_from: '2026-01-01'
        effective_to: '2027-01-01'
        auto_renew: false
        renewal_notice_days: 60
    VendorContractStatus:
      type: object
      required: [vendor_id, is_processor, has_dpa]
      properties:
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        is_processor: {type: boolean}
        has_dpa:
          description: Whether this vendor has at least one DPA (any status) on record
          type: boolean
    MissingDpaVendor:
      description: DPA-12 — a processor vendor with no DPA agreement in effect
      type: object
      required: [vendor_id, service_description]
      properties:
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        service_description: {type: string}
        relationship_owner_id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          nullable: true
    AgreementTypeRecommendation:
      type: object
      required: [agreement_type, legal_ref, reason_code]
      properties:
        agreement_type:
          description: The recommended value for Agreement.agreement_type
          type: string
          enum: [dpa, dsa, joint_controller]
        legal_ref:
          description: The PDPA section this recommendation is based on
          type: string
        reason_code:
          description: The counterparty_role this was computed from, for the frontend's own agreements.typeCheck.reasons.* i18n key
          type: string
    AgreementClauseInput:
      type: object
      required: [clause_id]
      properties:
        clause_id: {$ref: '#/components/schemas/Uuid', description: A published clause from the clause library (DPA-01)}
        position:
          type: integer
          minimum: 1
          description: Omit to append after every clause already attached
    AgreementClause:
      type: object
      required: [id, agreement_id, clause_id, clause_code, clause_title, legal_ref, is_mandatory, position, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        agreement_id: {$ref: '#/components/schemas/Uuid'}
        clause_id: {$ref: '#/components/schemas/Uuid'}
        clause_code: {type: string}
        clause_title: {type: string}
        legal_ref: {type: string}
        clause_version_no: {type: integer}
        is_mandatory: {type: boolean}
        position: {type: integer}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AgreementPartyInput:
      type: object
      required: [party_role]
      description: 'DSA-02: exactly one of party_id or legal_entity_id is required'
      properties:
        party_id: {$ref: '#/components/schemas/Uuid', description: An org.external_parties counterparty}
        legal_entity_id: {$ref: '#/components/schemas/Uuid', description: One of our own legal entities, named as a party in its own right (the joint-controller case)}
        party_role:
          type: string
          enum: [disclosing, receiving, joint_controller, controller, processor]
        signatory_name: {type: string}
        signatory_email: {type: string, format: email}
    AgreementParty:
      type: object
      required: [id, agreement_id, party_role, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        agreement_id: {$ref: '#/components/schemas/Uuid'}
        party_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        party_role:
          type: string
          enum: [disclosing, receiving, joint_controller, controller, processor]
        signatory_name: {type: string}
        signatory_email: {type: string}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AgreementMissingClause:
      type: object
      required: [clause_code, legal_ref]
      description: 'DPA-03: one agreement.mandatory_rules entry not yet attached to this agreement — PLT-08''s generic submit endpoint refuses to move the document to in_review while this list is non-empty'
      properties:
        clause_code: {type: string}
        legal_ref: {type: string}
    AgreementProcessingSchedule:
      type: object
      description: 'DPA-04: the ม.40 processing-schedule annex — data categories, data subject groups, purposes, retention and security measures per linked RoPA activity, composed live on every read, never persisted (same reasoning DPIA-04''s own live description already used).'
      required: [activities]
      properties:
        activities:
          type: array
          items:
            type: object
            required: [activity_id, activity_code, activity_name, purposes, data, retention, security_measures]
            properties:
              activity_id: {$ref: '#/components/schemas/Uuid'}
              activity_code: {type: string}
              activity_name: {type: string}
              purposes:
                type: array
                items:
                  type: object
                  required: [text, lawful_basis_code, lawful_basis_name_th]
                  properties:
                    text: {type: string}
                    lawful_basis_code: {type: string}
                    lawful_basis_name_th: {type: string}
                    lawful_basis_name_en: {type: string}
              data:
                type: array
                items:
                  type: object
                  required: [category_name_th, subject_type_name_th, is_sensitive]
                  properties:
                    category_name_th: {type: string}
                    category_name_en: {type: string}
                    subject_type_name_th: {type: string}
                    subject_type_name_en: {type: string}
                    is_sensitive: {type: boolean}
              retention:
                type: array
                items:
                  type: object
                  required: [retention_basis, trigger_event, disposal_method]
                  properties:
                    category_name_th: {type: string}
                    category_name_en: {type: string}
                    retention_months: {type: [integer, 'null']}
                    retention_basis: {type: string}
                    trigger_event: {type: string}
                    disposal_method: {type: string}
              security_measures:
                type: array
                items:
                  type: object
                  required: [code, name, category]
                  properties:
                    code: {type: string}
                    name: {type: string}
                    category: {type: string}
                    description: {type: string}
    RiskLevel:
      type: string
      description: risk.activity_scores.level's own CHECK constraint — the only four values any matrix may ever classify a score into
      enum: [low, medium, high, very_high]
    RiskThreshold:
      type: object
      required: [level, min_score]
      properties:
        level: {$ref: '#/components/schemas/RiskLevel'}
        min_score:
          type: number
          description: The score (likelihood x impact) at and above which this level applies
    RiskMatrixInput:
      type: object
      required: [name, likelihood_levels, impact_levels, thresholds]
      properties:
        name: {type: string}
        likelihood_levels:
          type: array
          minItems: 2
          maxItems: 10
          items: {type: string}
          description: Labels from lowest to highest likelihood, e.g. 5 entries for a 5x5 matrix
        impact_levels:
          type: array
          minItems: 2
          maxItems: 10
          items: {type: string}
        thresholds:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RiskThreshold'}
        is_default:
          type: boolean
          default: false
          description: At most one matrix per tenant may be the default — setting this clears the flag on every other one in the same request
    RiskMatrix:
      type: object
      required: [id, name, likelihood_levels, impact_levels, thresholds, is_default, row_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        likelihood_levels:
          type: array
          items: {type: string}
        impact_levels:
          type: array
          items: {type: string}
        thresholds:
          type: array
          items: {$ref: '#/components/schemas/RiskThreshold'}
        is_default: {type: boolean}
        row_version: {type: integer}
    RiskFactorContribution:
      type: object
      required: [code, contributes_to]
      properties:
        code:
          type: string
          description: Which signal from the activity's own RoPA data moved the score, e.g. sensitive_data, cross_border_transfer, no_controls
        contributes_to:
          type: string
          enum: [likelihood, impact]
    ActivityRiskScore:
      type: object
      required: [id, activity_id, matrix_id, likelihood, impact, score, level, factors, computed_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        activity_id: {$ref: '#/components/schemas/Uuid'}
        matrix_id: {$ref: '#/components/schemas/Uuid'}
        likelihood: {type: integer}
        impact: {type: integer}
        score:
          type: number
          description: likelihood x impact, classified against the matrix's own thresholds
        level: {$ref: '#/components/schemas/RiskLevel'}
        factors:
          type: array
          items: {$ref: '#/components/schemas/RiskFactorContribution'}
          description: Every RoPA signal that raised likelihood or impact — RRA-01's own "explain the factors" acceptance criterion
        computed_at: {$ref: '#/components/schemas/Timestamp'}
    RiskActivityChecklistInput:
      type: object
      required: [form_id, answers]
      properties:
        form_id: {$ref: '#/components/schemas/Uuid'}
        answers:
          type: object
          additionalProperties: {}
    RiskActivityChecklist:
      type: object
      required: [id, activity_id, form_submission_id, score, result, factors, completed_at, row_version]
