    ConsentSubmission:
      type: object
      required: [collection_point_code, subject, decisions]
      properties:
        collection_point_code:
          type: string
        subject:
          type: object
          required: [identifiers]
          properties:
            identifiers:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubjectIdentifier'
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            required: [purpose_code, purpose_version_no, decision]
            properties:
              purpose_code:
                type: string
              purpose_version_no:
                type: integer
                description: Version shown to the data subject; must be the active version or the request is rejected with consent.purpose_version_stale
              decision:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN]
              preferences:
                type: object
                additionalProperties: true
        language:
          type: string
          enum: [th, en]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ConsentResult:
      type: object
      required: [receipt_no, subject_ref, transactions]
      properties:
        receipt_no:
          type: string
        subject_ref:
          $ref: '#/components/schemas/Uuid'
        transactions:
          type: array
          items:
            type: object
            required: [id, purpose_code, transaction_type, status]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              purpose_code:
                type: string
              transaction_type:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN, EXPIRED, EXTENDED, PENDING, CONFIRMED, CANCELLED, CHANGED_PREFERENCES]
              status:
                type: string
                description: Resulting consent status (ST-01)
                enum: [ACTIVE, NOT_GIVEN, WITHDRAWN, EXPIRED, PENDING]
        guardian_approvals:
          type: array
          description: CON-11 (ม.20) — one entry when the submission started a guardian OTP; carry both ids forward to consentVerifyGuardianApproval.
          items:
            type: object
            required: [id, verification_id, channel]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              verification_id:
                $ref: '#/components/schemas/Uuid'
              channel:
                type: string
                enum: [sms, email]
    RetentionScheduleStatus:
      type: string
      description: A paused or retired schedule is never picked up by the daily due-date sweep.
      enum: [active, paused, retired]
    RetentionScheduleInput:
      type: object
      required: [retention_rule_id, asset_id, next_due_at]
      properties:
        retention_rule_id:
          $ref: '#/components/schemas/Uuid'
        asset_id:
          $ref: '#/components/schemas/Uuid'
        next_due_at:
          type: string
          format: date
          description: Entered by a human (DPX-05 has no automatic trigger-event-date computation); the next cycle is re-entered manually after a disposal job completes.
      example:
        retention_rule_id: 00000000-0000-0000-0000-000000000000
        asset_id: 00000000-0000-0000-0000-000000000000
        next_due_at: '2027-01-01'
    RetentionSchedule:
      type: object
