    BusinessCalendar:
      type: object
      required: [id, name, timezone, workdays, is_default, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        timezone:
          type: string
        workdays:
          type: array
          items:
            type: integer
        is_default:
          type: boolean
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Holiday:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
    ImportJob:
      type: object
      required: [id, import_type, status, headers, suggested, mapping, columns, has_error_report, row_version, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        import_type:
          type: string
        status:
          type: string
          enum: [queued, validating, ready, importing, done, failed]
        headers:
          type: array
          description: Header row of the file (empty until the file has been scanned and read)
          items:
            type: string
        suggested:
          type: object
          additionalProperties:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        columns:
          type: array
          items:
            type: object
            required: [key, label, required]
            properties:
              key:
                type: string
              label:
                type: object
                additionalProperties:
                  type: string
              required:
                type: boolean
        total_rows:
          type: [integer, 'null']
        valid_rows:
          type: [integer, 'null']
        error_rows:
          type: [integer, 'null']
        has_error_report:
          type: boolean
        failure:
          type: string
          description: file_rejected, file_unreadable, no_header_row, apply_failed_line_<n>
        row_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Comment:
      type: object
      required: [id, author_id, author_name, body, mentions, resolved, row_version, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        author_id:
          $ref: '#/components/schemas/Uuid'
        author_name:
          type: string
        body:
          type: string
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        resolved:
          type: boolean
        row_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Attachment:
      type: object
      required: [id, file_name, mime_type, size_bytes, av_status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        av_status:
          type: string
          enum: [pending, clean, infected, error]
        uploader_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Activity:
      type: object
      required: [id, occurred_at, actor_type, action]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor_type:
          type: string
        actor_name:
          type: string
        action:
          type: string
        before:
          type: [object, 'null']
        after:
          type: [object, 'null']
    NotificationChannel:
      type: string
      enum: [email, sms, line, in_app]
    NotificationStatus:
      type: string
      enum: [queued, sent, delivered, failed, cancelled]
    NotificationTemplateInput:
      type: object
      required: [code, channel, language, body]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_.]{1,79}$'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
          enum: [th, en]
        subject:
          type: string
        body:
          type: string
          description: text/template syntax, e.g. {{.request_no}}; every variable used must be declared
        variables:
          type: array
          items:
            type: string
    NotificationTemplate:
      type: object
      required: [id, global, code, channel, language, body, variables, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        global:
          type: boolean
          description: A platform template (read-only for tenants; override it by creating your own)
        code:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    NotificationDelivery:
      type: object
      required: [id, channel, status, attempts, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        template_code:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        recipient_masked:
          type: string
          description: Masked address, e.g. so****@example.co.th (empty for user recipients)
        status:
          $ref: '#/components/schemas/NotificationStatus'
        attempts:
          type: integer
        provider_message_id:
          type: string
        sent_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error:
          type: string
          description: Last failure, with addresses and numbers removed
        entity_type:
          type: string
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Inbox:
      type: object
      required: [unread, items]
      properties:
        unread:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [id, title, body, read, created_at]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              title:
                type: string
              body:
                type: string
              read:
                type: boolean
              created_at:
                $ref: '#/components/schemas/Timestamp'
    StoredFile:
      type: object
      required: [id, file_name, mime_type, size_bytes, sha256, av_status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        av_status:
          type: string
          enum: [pending, clean, infected, error]
        entity_type:
          type: [string, 'null']
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    JobState:
      type: string
      description: River job state
      enum: [available, cancelled, completed, discarded, pending, retryable, running, scheduled]
    Job:
      type: object
      description: One background job. Args are not exposed — they carry identifiers only.
      required: [id, kind, queue, state, attempt, max_attempts, created_at, scheduled_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        queue:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        attempt:
          type: integer
          description: Attempts made so far
        max_attempts:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        scheduled_at:
          $ref: '#/components/schemas/Timestamp'
        attempted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        finalized_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_error:
          type: [string, 'null']
          maxLength: 500
          description: Message of the most recent failed attempt (truncated), null if none
    JobList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: [string, 'null']
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the API
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC, e.g. 2026-09-25T03:15:00Z
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://docs.pdpa.example/problems/consent.purpose_inactive
        title:
          type: string
          example: Purpose is not active
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: '^[a-z_]+(\.[a-z_]+)+$|^[a-z_]+$'
          example: consent.purpose_inactive
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: decisions[0].purpose_code
        code:
          type: string
          example: required
        message:
          type: string
    Me:
      type: object
      required: [id, display_name, locale, tenant, roles, permissions, scopes, mfa_enrolled]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        email_masked:
          type: string
        locale:
          type: string
          enum: [th, en]
        tenant:
          type: object
          required: [id, code, name]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            code:
              type: string
            name:
              type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          description: Effective permission codes (x-permission values)
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/DataScope'
        mfa_enrolled:
          type: boolean
    DataScope:
      type: object
      required: [scope_type]
      properties:
        scope_type:
          type: string
          enum: [tenant, legal_entity, org_unit, self]
        legal_entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        org_unit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        include_descendants:
          type: boolean
    PublicCollectionPoint:
      type: object
      required: [code, name, channel, purposes, double_opt_in, verification_method]
      properties:
        code:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [web, app, pos, call_center, kiosk, paper, line, api, import, cookie]
        verification_method:
          type: string
          enum: [none, otp, magic_link, idp]
        double_opt_in:
          type: boolean
        age_gate:
          type: boolean
          description: Ask for age / guardian before consent (ม.20); minimum ages are per purpose (min_age)
        notice:
          type: [object, 'null']
          properties:
            slug:
              type: string
            version_no:
              type: integer
            url:
              type: string
              format: uri
        purposes:
          type: array
          items:
            $ref: '#/components/schemas/PublicPurpose'
    PublicPurpose:
      type: object
      required: [code, version_no, name, text, is_sensitive, requires_explicit]
      properties:
        code:
          type: string
        version_no:
          type: integer
        name:
          type: string
        text:
          type: string
          description: Consent text of this version in the requested language (sanitized HTML)
        is_sensitive:
          type: boolean
        requires_explicit:
          type: boolean
        min_age:
          type: [integer, 'null']
        preferences:
          type: array
          items:
            type: object
            required: [code, name, pref_type]
            properties:
              code:
                type: string
              name:
                type: string
              pref_type:
                type: string
                enum: [channel, topic, frequency, other]
              options:
                type: array
                description: From consent.purpose_preferences.options
                items:
                  type: object
                  required: [value, label]
                  properties:
                    value:
                      type: string
                    label:
                      type: string
    SubjectIdentifier:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [email, phone, national_id, customer_id, passport, line_uid, other]
        value:
          type: string
          description: Normalized by the API (lower-case e-mail, E.164 phone) before blind indexing. Never logged.
          writeOnly: true
    ConsentSubmission:
      type: object
      required: [collection_point_code, subject, decisions]
      properties:
        collection_point_code:
          type: string
        subject:
          type: object
          required: [identifiers]
          properties:
            identifiers:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubjectIdentifier'
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            required: [purpose_code, purpose_version_no, decision]
            properties:
              purpose_code:
                type: string
              purpose_version_no:
                type: integer
                description: Version shown to the data subject; must be the active version or the request is rejected with consent.purpose_version_stale
              decision:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN]
              preferences:
                type: object
                additionalProperties: true
        language:
          type: string
          enum: [th, en]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ConsentResult:
      type: object
      required: [receipt_no, subject_ref, transactions]
      properties:
        receipt_no:
          type: string
        subject_ref:
          $ref: '#/components/schemas/Uuid'
        transactions:
          type: array
          items:
            type: object
            required: [id, purpose_code, transaction_type, status]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              purpose_code:
                type: string
              transaction_type:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN, EXPIRED, EXTENDED, PENDING, CONFIRMED, CANCELLED, CHANGED_PREFERENCES]
              status:
                type: string
                description: Resulting consent status (ST-01)
                enum: [ACTIVE, NOT_GIVEN, WITHDRAWN, EXPIRED, PENDING]
