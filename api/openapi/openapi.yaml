    post:
      operationId: consentSubmitConsents
      tags: [consent]
      summary: Record consent decisions from a channel system (CRM / POS / app)
      description: |
        SEQ-04. One receipt per call, one consent transaction per purpose decision, consent status projection updated and
        `consent.*` events written to the outbox in the same transaction. Replaying the same Idempotency-Key with the same
        body returns the stored status and body (201) with `Idempotent-Replayed: true`.
      x-permission: consent.record.create
      x-module: consent
      security:
        - clientCredentials: [consent.record.create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSubmission'
            example:
              collection_point_code: CRM-MEMBER
              subject:
                identifiers:
                  - type: email
                    value: customer@example.com
              decisions:
                - purpose_code: MARKETING-EMAIL
                  purpose_version_no: 3
                  decision: CONSENTED
                  preferences:
                    frequency: weekly
                - purpose_code: PROFILING
                  purpose_version_no: 1
                  decision: NOT_CONSENTED
              language: th
              occurred_at: '2026-09-25T03:15:00Z'
      responses:
        '201':
          description: Recorded (also returned, with Idempotent-Replayed, when an identical request is replayed)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token attached server-side by the admin BFF. Browsers never hold it.
    portalToken:
      type: http
      scheme: bearer
      description: Short-lived token issued by the API after OTP / ThaID verification (idle 30 minutes), kept by the portal BFF.
    guestToken:
      type: http
      scheme: bearer
      description: Session issued after a guest link token plus e-mail OTP; bound to one task (IAM-04).
    clientCredentials:
      type: oauth2
      description: OAuth2 client credentials via Keycloak (single realm, tenant in the `tid` claim — decisions Q-18), access token at most 15 minutes. Scopes are permission codes (decisions Q-10).
      flows:
        clientCredentials:
          tokenUrl: https://auth.pdpa.example/realms/pdpa/protocol/openid-connect/token
          scopes:
            consent.record.create: Record consent decisions
            consent.record.read: Read consent status of data subjects
            dsar.request.create: Submit data subject requests
            breach.incident.create: Report incidents (SIEM)
    scimBearer:
      type: http
      scheme: bearer
      description: SCIM 2.0 bearer token per tenant
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 't=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + body)>; reject if older than 5 minutes'
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: Record type registered by its module (e.g. notification_template, dsar_request)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,59}$'
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended). Kept 24 hours per tenant and principal. Missing → 428 (the validator maps it).
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (row_version) of the resource being modified. Mismatch → 412, missing → 428.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields; prefix with `-` for descending (e.g. `-created_at`)
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of messages and localized fields (default th)
      schema:
        type: string
        enum: [th, en]
        default: th
  headers:
    ETag:
      description: Current row_version of the resource
      schema:
        type: string
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier request with the same Idempotency-Key
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or schema validation failure (`request.invalid`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials (`authn.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (`authz.denied`) — also written to iam.security_events
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible in this tenant / scope (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state (`<module>.invalid_transition`, `idempotency.in_progress`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current row_version (`conflict.version_mismatch`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required Idempotency-Key or If-Match header missing (`precondition.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business rule violation (`<module>.<rule>`, `idempotency.key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    VersionChange:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: JSON path, e.g. `purposes[1]` or `contact.email`; `$` for the whole document
        before: {}
        after: {}
    ApprovalStep:
      type: object
      required: [id, step, role, requested_by, decision, row_version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        step:
          type: integer
        role:
          type: string
        requested_by:
          $ref: '#/components/schemas/Uuid'
        requester_name:
          type: string
        approver_id:
          $ref: '#/components/schemas/Uuid'
        approver_name:
          type: string
        decision:
          type: string
          enum: [pending, approved, rejected, returned]
        reason:
          type: string
        decided_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
    RecordVersion:
      type: object
      required: [id, entity_type, entity_id, version, snapshot, status, created_at, updated_at, row_version, diff, approvals]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        entity_type:
          type: string
        entity_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
        snapshot: {}
        diff:
          type: array
          description: Changes against the version published when this one was submitted
          items:
            $ref: '#/components/schemas/VersionChange'
        status:
          type: string
          enum: [draft, in_review, approved, published, superseded]
        author_id:
          $ref: '#/components/schemas/Uuid'
        author_name:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStep'
    ApprovalInboxItem:
      allOf:
        - $ref: '#/components/schemas/ApprovalStep'
        - type: object
          required: [version_id, entity_type, entity_id, version]
          properties:
            version_id:
              $ref: '#/components/schemas/Uuid'
            entity_type:
              type: string
            entity_id:
              $ref: '#/components/schemas/Uuid'
            version:
              type: integer
            title:
              type: string
            author_name:
              type: string
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_type, action]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor_type:
          type: string
          enum: [user, api_client, guest, data_subject, system]
        actor_id:
          $ref: '#/components/schemas/Uuid'
        actor_name:
          type: string
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          $ref: '#/components/schemas/Uuid'
        entity_name:
          type: string
          description: For entity_type user — whose record changed
        before: {}
        after: {}
        ip:
          type: string
        user_agent:
          type: string
    LocalizedText:
      type: object
      required: [th]
      properties:
        th:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          maxLength: 200
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
    WorkflowDuration:
      type: object
      required: [mode, amount]
      properties:
        mode:
          type: string
          enum: [calendar_days, business_days, hours]
        amount:
          type: integer
          minimum: 1
          maximum: 8760
    WorkflowState:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
        label:
          $ref: '#/components/schemas/LocalizedText'
        terminal:
          type: boolean
        pause_sla:
          type: boolean
          description: The SLA clock stops while the instance is in this state
        task:
          type: object
          required: [title]
          description: Work opened on entering the state, for exactly one of a user or a group
          properties:
            title:
              $ref: '#/components/schemas/LocalizedText'
            assignee_user_id:
              $ref: '#/components/schemas/Uuid'
            assignee_group_id:
              $ref: '#/components/schemas/Uuid'
            due:
              $ref: '#/components/schemas/WorkflowDuration'
    WorkflowTransition:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
    WorkflowSLA:
      type: object
      required: [code, mode, amount]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        mode:
          type: string
          enum: [calendar_days, business_days, hours]
        amount:
          type: integer
          minimum: 1
          maximum: 8760
        calendar_id:
          $ref: '#/components/schemas/Uuid'
        remind_before:
          type: array
          description: Remind this long before the due time, in the SLA's unit (e.g. [10, 5] on 30 days = day 20 and 25)
          maxItems: 5
          items:
            type: integer
            minimum: 1
        escalate_user_ids:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Uuid'
        escalate_group_id:
          $ref: '#/components/schemas/Uuid'
    WorkflowDefinitionBody:
      type: object
      required: [initial, states, transitions]
      properties:
        initial:
          type: string
        states:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/WorkflowState'
        transitions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/WorkflowTransition'
        sla:
          $ref: '#/components/schemas/WorkflowSLA'
    WorkflowDefinitionInput:
      type: object
      required: [code, name, entity_type, definition]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
          description: Ignored when saving a new version (the version keeps its workflow's code)
        name:
          type: string
          minLength: 1
          maxLength: 200
        entity_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
          description: The kind of record the workflow runs for, e.g. dsar_request
        definition:
          $ref: '#/components/schemas/WorkflowDefinitionBody'
      example:
        code: dsar_access
        name: คำขอเข้าถึงข้อมูล
        entity_type: dsar_request
        definition:
          initial: review
          states:
            - key: review
              label: {th: ตรวจสอบคำขอ, en: Review}
              task: {title: {th: ตรวจสอบคำขอ}, assignee_group_id: 01925f3c-7b8e-7c3a-9d51-2f0c6e1a4b77}
            - key: awaiting_info
              label: {th: รอข้อมูลเพิ่มเติม}
              pause_sla: true
            - key: done
              label: {th: เสร็จสิ้น}
              terminal: true
          transitions:
            - {from: review, to: awaiting_info}
            - {from: awaiting_info, to: review}
            - {from: review, to: done}
          sla: {code: response, mode: calendar_days, amount: 30, remind_before: [10, 5]}
    WorkflowDefinition:
      type: object
      required: [id, global, code, name, entity_type, version, definition, active, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        global:
          type: boolean
          description: Provided by the platform; saving a version creates the tenant's own
        code:
          type: string
        name:
          type: string
        entity_type:
          type: string
        version:
          type: integer
        definition:
          $ref: '#/components/schemas/WorkflowDefinitionBody'
        active:
          type: boolean
        names:
          type: object
          description: Display names of the users and groups the definition refers to, by id
          additionalProperties:
            type: string
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    WorkflowTask:
      type: object
      required: [id, instance_id, state, title, status, row_version, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        instance_id:
          $ref: '#/components/schemas/Uuid'
        state:
