    RopaTemplateSet:
      type: object
      required: [id, name, set_type, version_no]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        set_type:
          type: string
          enum: [standard, industry, government, processor, custom]
        industry: {type: string}
        version_no: {type: integer}
        status:
          description: 'RTG-08: draft/published/retired — only present on a tenant''s own custom set; the global standard/industry/government/processor sets are always published.'
          type: string
          enum: [draft, published, retired]
        row_version:
          description: 'RTG-08: the set''s own ETag, for publish/retire (If-Match).'
          type: integer
    RopaTemplateSetInput:
      type: object
      description: 'RTG-08: creates a new, tenant-owned custom template set (draft, empty — add activities to it, or clone an existing set''s activities into it instead).'
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    RopaCloneTemplateSetInput:
      type: object
      description: 'RTG-08: clones a template set''s current activities into a brand-new, tenant-owned custom set (draft) — editing the clone afterward never touches the source.'
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    RopaActivityTemplate:
      type: object
      description: 'RTG-01: a ready-made RoPA activity. defaults/rationale are the raw seeded JSON (no fixed shape here — every ม.39 topic keyed by code, not id, since a global template can''t reference a tenant''s own org.* rows), displayed as-is by the admin UI.'
      required: [id, template_set_id, code, name_th, job_category, role, defaults, rationale, legal_refs, version_no]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        template_set_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        name_th: {type: string}
        name_en: {type: string}
        job_category: {type: string}
        role:
          type: string
          enum: [controller, processor]
        defaults:
          type: object
          additionalProperties: true
        rationale:
          type: object
          additionalProperties: true
        legal_refs:
          type: array
          items: {type: string}
        version_no: {type: integer}
        row_version:
          description: 'RTG-08: the activity template''s own ETag, for update/delete (If-Match) — only meaningful on a tenant''s own custom activity.'
          type: integer
    RopaActivityTemplateInput:
      type: object
      description: 'RTG-08: adds (or edits) one activity in the caller''s own custom template set — defaults/rationale follow RopaActivityTemplate''s own ม.39-topic-keyed shape.'
      required: [code, name_th, job_category, role, defaults, rationale]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
        name_th: {type: string, minLength: 1}
        name_en: {type: string}
        job_category: {type: string, maxLength: 40}
        role:
          type: string
          enum: [controller, processor]
        defaults:
          type: object
          additionalProperties: true
        rationale:
          type: object
          additionalProperties: true
        legal_refs:
          type: array
          items: {type: string}
    RopaOutdatedTemplateActivity:
      type: object
      description: 'RTG-10: one activity whose own template has since been reissued at a newer version — "รายการที่ต้องทบทวน".'
      required: [activity_id, activity_name, activity_code, template_code, current_version, latest_version]
      properties:
        activity_id: {$ref: '#/components/schemas/Uuid'}
        activity_name: {type: string}
        activity_code: {type: string}
        template_code: {type: string}
        current_version: {type: integer}
        latest_version: {type: integer}
    RopaSmeExemptionResult:
      type: string
      enum: [exempt, not_exempt, partial]
    RopaSmeExemptionCheckInput:
      type: object
      required: [legal_entity_id, is_processor, answers]
      additionalProperties: false
      properties:
        legal_entity_id:
          $ref: '#/components/schemas/Uuid'
        is_processor:
          type: boolean
          description: Whether this legal entity also acts as a processor — the 2567 processor-exemption section only applies when true.
        answers:
          type: object
          description: 'Question key → "yes" | "no", for every question in the seeded sme_exemption screening form.'
          additionalProperties:
            type: string
            enum: [yes, no]
      example:
        legal_entity_id: 00000000-0000-0000-0000-000000000000
        is_processor: false
        answers:
          is_sme_or_community: 'yes'
          not_large_scale: 'yes'
          no_sensitive_data: 'yes'
          no_high_risk_profiling: 'yes'
    RopaSmeExemptionCheck:
      type: object
      required: [id, legal_entity_id, form_submission_id, result, basis, assessed_at, row_version, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        legal_entity_id:
          $ref: '#/components/schemas/Uuid'
        form_submission_id:
          $ref: '#/components/schemas/Uuid'
        result:
          $ref: '#/components/schemas/RopaSmeExemptionResult'
        basis:
          type: string
          description: The acceptance criterion's own reason, citing the relevant notice(s).
        assessed_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    RopaSuggestedPurpose:
      type: object
      description: 'RTG-06: index is this item''s position — echo it back in RopaApplySuggestedItemsInput.purposes to confirm it.'
      required: [index, purpose_text, lawful_basis_code, lawful_basis_name_th, rationale]
      properties:
        index: {type: integer}
        purpose_text: {type: string}
        lawful_basis_code: {type: string}
        lawful_basis_name_th: {type: string}
        rationale: {type: string}
    RopaSuggestedData:
      type: object
      required: [index, data_category_code, data_category_name, subject_type_code, subject_type_name, is_sensitive, source, rationale]
      properties:
        index: {type: integer}
        data_category_code: {type: string}
        data_category_name: {type: string}
        subject_type_code: {type: string}
        subject_type_name: {type: string}
        is_sensitive: {type: boolean}
        source:
          type: string
          enum: [direct, indirect]
        rationale: {type: string}
    RopaSuggestedRetention:
      type: object
      required: [index, retention_basis, trigger_event, disposal_method, rationale]
      properties:
        index: {type: integer}
        retention_months: {type: integer}
        retention_basis: {type: string}
        trigger_event: {type: string}
        disposal_method: {type: string}
        rationale: {type: string}
    RopaTemplateSuggestions:
      type: object
      description: 'RTG-06: one template''s purposes/data/retention, each decorated with a rationale citing a real legal article (ม.24/26/39) — read-only; nothing is saved until RopaApplySuggestedItemsInput confirms specific items.'
      required: [template_id, template_code, template_name, purposes, data, retention]
      properties:
        template_id: {$ref: '#/components/schemas/Uuid'}
        template_code: {type: string}
        template_name: {type: string}
        purposes:
          type: array
          items: {$ref: '#/components/schemas/RopaSuggestedPurpose'}
        data:
          type: array
          items: {$ref: '#/components/schemas/RopaSuggestedData'}
        retention:
          type: array
          items: {$ref: '#/components/schemas/RopaSuggestedRetention'}
    RopaApplySuggestedItemsInput:
      type: object
      description: 'RTG-06: indices into the matching RopaTemplateSuggestions arrays — anything left out is never written.'
      required: [activity_template_id]
      properties:
        activity_template_id: {$ref: '#/components/schemas/Uuid'}
        purposes:
          type: array
          items: {type: integer}
        data:
          type: array
          items: {type: integer}
        retention:
          type: array
          items: {type: integer}
      example:
        activity_template_id: 00000000-0000-0000-0000-000000000000
        purposes: [0]
        data: [0, 1]
        retention: [0]
    ActivityRejection:
      type: object
      required: [id, activity_id, dsar_request_id, reason_code, rejected_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        activity_id: {$ref: '#/components/schemas/Uuid'}
        dsar_request_id: {$ref: '#/components/schemas/Uuid'}
        reason_code: {type: string}
        rejected_at: {type: string, format: date-time}
    DsarRequestType:
      type: object
      required: [id, code, name_th, sla_days]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code:
          type: string
          enum: [access, portability, objection, erasure, restriction, rectification, withdraw_consent, complaint, inquiry]
        name_th: {type: string}
        name_en: {type: string}
        legal_ref: {type: string}
        sla_days: {type: integer}
    DsarRequestChannel:
      type: string
      enum: [web, email, phone, branch, letter, line, api]
    DsarRequestStatus:
      type: string
      enum: [received, verifying, in_review, in_progress, awaiting_info, completed, rejected, withdrawn]
    DsarOutcome:
      type: string
      enum: [fulfilled, partially_fulfilled, rejected, withdrawn]
    DsarContactKind:
      type: string
      enum: [email, phone, national_id, customer_id, passport, line_uid, other]
    DsarRequestInput:
      type: object
      required: [request_type_id, legal_entity_id, channel, requester_name, requester_contact, contact_kind]
      properties:
        request_type_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        channel: {$ref: '#/components/schemas/DsarRequestChannel'}
        on_behalf: {type: boolean, default: false}
        requester_name: {type: string, minLength: 1, maxLength: 300}
        requester_contact: {type: string, minLength: 1, maxLength: 300}
        contact_kind: {$ref: '#/components/schemas/DsarContactKind'}
        data_source:
          description: DSAR-03, ม.30 — for an access request, where the data was obtained when not collected directly from the data subject. Disclosed verbatim in the generated response letter.
          type: string
          maxLength: 500
    DsarSlaStatus:
      type: string
      description: DSAR-07 — computed live off due_at, never stored — on_track, at_risk (10 days or fewer left) or overdue.
      enum: [on_track, at_risk, overdue]
    DsarRequest:
      type: object
      required: [id, request_no, request_type_id, legal_entity_id, channel, on_behalf, status, received_at, due_at, sla_status, row_version, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        request_no: {type: string}
        request_type_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        channel: {$ref: '#/components/schemas/DsarRequestChannel'}
        on_behalf: {type: boolean}
        status: {$ref: '#/components/schemas/DsarRequestStatus'}
        received_at: {type: string, format: date-time}
        due_at: {type: string, format: date-time}
        sla_status: {$ref: '#/components/schemas/DsarSlaStatus'}
        verified_at: {type: [string, 'null'], format: date-time}
        closed_at: {type: [string, 'null'], format: date-time}
        outcome:
          oneOf:
            - $ref: '#/components/schemas/DsarOutcome'
            - type: 'null'
        rejection_reason_code: {type: [string, 'null']}
        assignee_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        data_source: {type: [string, 'null']}
        consent_receipt_no:
          description: The consent receipt a fulfilled withdraw-consent request's own automatic CON update produced (DSAR-21), if any
          type: [string, 'null']
        row_version: {type: integer}
        updated_at: {type: string, format: date-time}
    DsarAssignInput:
      type: object
      properties:
        assignee_user_id:
          description: The responsible person notified alongside role DPO when the SLA reminder fires (DSAR-07). Omit or null to unassign.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    DsarTransitionInput:
      type: object
      required: [to]
      properties:
        to: {$ref: '#/components/schemas/DsarRequestStatus'}
        outcome: {$ref: '#/components/schemas/DsarOutcome'}
        rejection_reason_code: {type: string}
        activity_ids:
          type: array
          description: RoPA processing activities this rejection concerns (DSAR-11, ม.39(7)) — logged against each one (ROPA-10) once the rejection is confirmed
          items:
            $ref: '#/components/schemas/Uuid'
          default: []
        asset_ids:
          type: array
          description: DSAR-03 — entering in_progress with one or more RoPA assets (systems that hold the subject's data) opens one subtask per asset, its action chosen by the request's own right type (ม.30/31/32/33/34/35-36/19 — "สร้าง subtask ไปทุกระบบที่มีข้อมูล")
          items:
            $ref: '#/components/schemas/Uuid'
          default: []
    DsarTransitionResult:
      type: object
      required: [request]
      properties:
        request: {$ref: '#/components/schemas/DsarRequest'}
        document_id:
          description: The generated response-letter document's id (PLT-16), when this transition produced one
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    DsarVerificationMethod:
      type: string
      enum: [otp_sms, otp_email, id_document]
    DsarVerificationStatus:
      type: string
      enum: [pending, passed, failed]
    DsarVerification:
      type: object
      required: [id, request_id, method, status, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        request_id: {$ref: '#/components/schemas/Uuid'}
        method: {$ref: '#/components/schemas/DsarVerificationMethod'}
        status: {$ref: '#/components/schemas/DsarVerificationStatus'}
        masked_id_file_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        verified_by:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        verified_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    DsarStartOtpVerificationInput:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [otp_sms, otp_email]
    DsarConfirmOtpInput:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 1, maxLength: 20}
    DsarIdentityRedaction:
      type: object
      required: [x, y, width, height]
      description: A pixel rectangle (image's own coordinate space) to black out before the ID copy is ever stored — the raw upload named by raw_file_id is never itself attached or kept (CLAUDE.md rule 3).
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    DsarSubmitIdDocumentInput:
      type: object
      required: [raw_file_id, redactions]
      properties:
        raw_file_id:
          description: The caller's own clean, still-unattached PLT-09 upload (POST /admin/v1/platform/files) of the ID-card photo
          $ref: '#/components/schemas/Uuid'
        redactions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DsarIdentityRedaction'
    DsarDecideVerificationInput:
      type: object
      required: [pass]
      properties:
        pass: {type: boolean}
    DsarAuthorityType:
      type: string
      description: DSAR-04, ม.20 — the agent's own authority to submit on the data subject's behalf.
      enum: [power_of_attorney, parent, guardian, curator]
    DsarAgent:
      type: object
      required: [id, request_id, authority_type, authority_file_id, created_at, row_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        request_id: {$ref: '#/components/schemas/Uuid'}
        authority_type: {$ref: '#/components/schemas/DsarAuthorityType'}
        authority_file_id: {$ref: '#/components/schemas/Uuid'}
        verified_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        row_version: {type: integer}
    DsarRecordAgentInput:
      type: object
      required: [agent_name, authority_type, authority_file_id]
      properties:
        agent_name: {type: string, minLength: 1, maxLength: 300}
        authority_type: {$ref: '#/components/schemas/DsarAuthorityType'}
        authority_file_id:
          description: The agent's own clean, still-unattached PLT-09 upload (POST /admin/v1/platform/files) of the power of attorney / guardianship document
          $ref: '#/components/schemas/Uuid'
    DsarExemptionResult:
      type: string
      description: DSAR-10, ม.33 — the outcome of checking an erasure request's own assets against active legal holds.
      enum: [can_delete, must_retain, partial]
    DsarLegalHold:
      type: object
      required: [id, law_ref, is_active, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        data_category_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        asset_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        law_ref: {type: string}
        hold_rule: {type: object, additionalProperties: true}
        is_active: {type: boolean}
        row_version: {type: integer}
        created_at: {type: string, format: date-time}
    DsarLegalHoldInput:
      type: object
      required: [law_ref]
      additionalProperties: false
      properties:
        data_category_id:
          description: One of the two scope fields must be set — a hold with neither would match nothing
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        asset_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        law_ref: {type: string, minLength: 1, maxLength: 300}
        hold_rule: {type: object, additionalProperties: true, default: {}}
    DsarExemptionCheck:
      type: object
      required: [id, request_id, result, reason, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        request_id: {$ref: '#/components/schemas/Uuid'}
        legal_hold_id:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
        result: {$ref: '#/components/schemas/DsarExemptionResult'}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    DsarRunExemptionCheckInput:
      type: object
      required: [asset_ids]
      additionalProperties: false
      properties:
        asset_ids:
          description: The RoPA assets (systems) this erasure request's own work touches — same scope DSAR-03's own asset picker already names on the request
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Uuid'}
    DsarPackageFormat:
      type: string
      enum: [pdf, csv, json, xml, zip]
    DsarPackage:
      type: object
      required: [id, request_id, file_id, format, password_protected, expires_at, download_count, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        request_id: {$ref: '#/components/schemas/Uuid'}
        file_id: {$ref: '#/components/schemas/Uuid'}
        format: {$ref: '#/components/schemas/DsarPackageFormat'}
        password_protected: {type: boolean}
        expires_at: {type: string, format: date-time}
        download_count: {type: integer}
        last_downloaded_at:
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        purged_at:
          description: Set once the link's expiry swept its underlying file's bytes away (DSAR-14's own "ลบไฟล์อัตโนมัติเมื่อหมดอายุ")
          oneOf: [{type: string, format: date-time}, {type: 'null'}]
        row_version: {type: integer}
        created_at: {type: string, format: date-time}
    DsarCreatePackageInput:
      type: object
      required: [file_id, format]
      additionalProperties: false
      properties:
        file_id:
          description: Either the caller's own clean, still-unattached PLT-09 upload (attached to this request here), or a file already attached to it (DSAR-13's own generated letter, or anything DSAR-17's collaboration panel attached) — never an arbitrary file id
          $ref: '#/components/schemas/Uuid'
        format: {$ref: '#/components/schemas/DsarPackageFormat'}
        password_protected: {type: boolean, default: true}
        expires_at:
          description: Defaults to 7 days from now when omitted
          type: string
          format: date-time
    DsarCreatePackageResult:
      type: object
      required: [package, public_key]
      properties:
        package: {$ref: '#/components/schemas/DsarPackage'}
        public_key:
          description: The /public/v1/dsar-packages/{key} path segment — the link to share with the data subject
          type: string
        access_code:
          description: Shown here exactly once — share it with the data subject through a different channel than the link itself; absent when password_protected is false
          type: string
    DsarGeneratePortabilityExportInput:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [json, csv, xml]
        password_protected: {type: boolean, default: true}
        expires_at:
          description: Defaults to 7 days from now when omitted
          type: string
          format: date-time
    CookieDomain:
      type: object
      required: [id, domain, legal_entity_id, status, row_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        domain: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        status:
          type: string
          enum: [pending, verified]
        public_key:
          description: The embed snippet's own data-domain-key — set only once the domain's banner has been published at least once
          type: string
        row_version: {type: integer}
    CookieRegisterDomainInput:
      type: object
      required: [domain, legal_entity_id]
      additionalProperties: false
      properties:
        domain: {type: string}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
    CookieCategory:
      type: object
      required: [id, code, name_th, is_required, display_order, row_version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        name_th: {type: string}
        name_en: {type: string}
        description_th: {type: string}
        description_en: {type: string}
        is_required: {type: boolean}
        display_order: {type: integer}
        row_version: {type: integer}
    CookieCreateCategoryInput:
      type: object
      required: [code, name_th]
      additionalProperties: false
      properties:
        code: {type: string}
        name_th: {type: string}
        name_en: {type: string}
        description_th: {type: string}
        description_en: {type: string}
        is_required: {type: boolean, default: false}
        display_order: {type: integer, default: 0}
    CookieBannerTexts:
      description: |
        The banner's own bilingual copy — accept-all, reject-all and settings are deliberately equal-weight
        fields; none of them is more "default" than another (the acceptance criterion's own "ปฏิเสธทั้งหมดได้ใน
        คลิกเดียว...น้ำหนักเท่ากัน").
      type: object
      required: [title_th, accept_all_th, reject_all_th, settings_th]
      additionalProperties: false
      properties:
        title_th: {type: string}
        title_en: {type: string}
        description_th: {type: string}
        description_en: {type: string}
        accept_all_th: {type: string}
        accept_all_en: {type: string}
        reject_all_th: {type: string}
        reject_all_en: {type: string}
        settings_th: {type: string}
        settings_en: {type: string}
        translations:
          description: Extra languages beyond th/en (CON-06) — the SDK picks one by the visitor's browser language
          type: object
          additionalProperties: {$ref: '#/components/schemas/CookieBannerTranslation'}
    CookieBannerTranslation:
      type: object
      required: [title, accept_all, reject_all, settings]
      additionalProperties: false
      properties:
        title: {type: string}
        description: {type: string}
        accept_all: {type: string}
        reject_all: {type: string}
        settings: {type: string}
    CookieBannerTheme:
      description: Design customization (CON-06) — colors, logo, docking edge and a tenant's own limited custom CSS
      type: object
      additionalProperties: false
      properties:
        primary_color: {type: string}
        text_color: {type: string}
        button_text_color: {type: string}
        logo_url: {type: string}
        position: {type: string, enum: [top, bottom, center]}
        custom_css: {type: string, maxLength: 2000}
    CookieBannerConfigInput:
      type: object
      required: [layout, texts]
      additionalProperties: false
      properties:
