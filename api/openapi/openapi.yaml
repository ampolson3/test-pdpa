        control_category: {type: string}
        status: {$ref: '#/components/schemas/DpiaRiskControlStatus'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
        due_at: {type: [string, 'null'], format: date}
        task_id: {$ref: '#/components/schemas/Uuid'}
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    DataflowNode:
      type: object
      description: One box on the diagram — an org unit (a swimlane other nodes nest under via parent_id), a processing activity, an external-party recipient, or a destination country.
      required: [id, type, label]
      properties:
        id: {type: string, description: 'Stable within one graph response, e.g. "activity:<uuid>" — not a database id on its own.'}
        type:
          type: string
          enum: [org_unit, activity, recipient, country, disposal]
        label: {type: string}
        parent_id: {type: string, description: "The containing org_unit node's id, for an activity node"}
        activity_code: {type: string}
        activity_status: {type: string}
        role:
          type: string
          description: controller or processor, for an activity node
        purposes:
          type: array
          items: {type: string}
        data_categories:
          type: array
          items: {type: string}
        recipient_role: {type: string}
        disclosure_basis: {type: string}
        country_code: {type: string}
        disposal_methods:
          type: array
          items: {type: string}
        warning:
          type: boolean
          description: 'DFG-04: true on a processor recipient tracked as a vendor with no agreement.agreements row of type "dpa". DSA-12: true on a controller/joint_controller recipient with no row of type "dsa" naming it.'
        vendor_id: {$ref: '#/components/schemas/Uuid'}
        agreement_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
          description: 'DFG-04/DSA-12: this recipient''s own DPA or DSA agreements, to link through to from the diagram.'
    DataflowEdge:
      type: object
      description: One arrow on the diagram, between two DataflowNode ids.
      required: [id, source, target, type, warning]
      properties:
        id: {type: string}
        source: {type: string}
        target: {type: string}
        type:
          type: string
          enum: [send, transfer, destroy]
        label: {type: string}
        warning:
          type: boolean
          description: 'DFG-03: true on a transfer edge to a foreign recipient''s country with no logged ROPA-08 transfer basis — rendered in warning colour.'
    DataflowGraph:
      type: object
      description: 'DFG-01/DFG-03: the whole tenant diagram (or one legal entity''s), computed live from RoPA on every call — never a stale persisted copy.'
      required: [nodes, edges, activity_count, generated_at]
      properties:
        nodes:
          type: array
          items: {$ref: '#/components/schemas/DataflowNode'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/DataflowEdge'}
        activity_count: {type: integer}
        generated_at: {$ref: '#/components/schemas/Timestamp'}
    DataflowSnapshotSummary:
      type: object
      description: 'DFG-07: one published version of the diagram, graph omitted — the version history list ("ดูแผนผังที่ publish ย้อนหลังได้").'
      required: [id, version_no, published_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        version_no: {type: integer}
        published_by: {$ref: '#/components/schemas/Uuid'}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    DataflowSnapshot:
      type: object
      description: 'DFG-07: one published version, graph included — exactly the same shape DataflowGraph already uses, frozen at publish time.'
      required: [id, version_no, published_at, created_at, graph]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        version_no: {type: integer}
        published_by: {$ref: '#/components/schemas/Uuid'}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        graph: {$ref: '#/components/schemas/DataflowGraph'}
    DpiaNecessity:
      type: object
      description: 'DPIA-05: "necessary" only once every question is answered "yes"; otherwise "needs_review" names the flagged questions.'
      required: [assessment_id, result, missing, answers, submitted_at]
      properties:
        assessment_id: {$ref: '#/components/schemas/Uuid'}
        result:
          type: string
          enum: [necessary, needs_review]
        missing:
          type: array
          items: {type: string}
        answers:
          type: array
          items:
            type: object
            required: [question, answer]
            properties:
              question: {type: string}
              answer: {}
        submitted_at: {$ref: '#/components/schemas/Timestamp'}
    DpiaAssessmentDiff:
      type: object
      description: 'DPIA-14: which screening answers changed since the round this one supersedes (assess.assessments.previous_id). Empty changes for a first round or an unchanged re-screen.'
      required: [assessment_id, changes]
      properties:
        assessment_id: {$ref: '#/components/schemas/Uuid'}
        previous_id: {$ref: '#/components/schemas/Uuid'}
        changes:
          type: array
          items:
            type: object
            required: [question]
            properties:
              question: {type: string}
              before: {}
              after: {}
    DpiaTemplate:
      type: object
      required: [id, assessment_type, code, name, form_id, version_no, status, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        assessment_type: {type: string}
        code: {type: string}
        name: {type: string}
        form_id: {$ref: '#/components/schemas/Uuid'}
        version_no: {type: integer}
        legal_refs:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [draft, published, retired]
        row_version: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    DpiaActivityDescription:
      type: object
      description: 'DPIA-04: composed live from the assessment''s RoPA activity on every read — never persisted, so it always reflects the activity''s current data.'
      required: [activity_id, activity_code, activity_name, role, purposes, data, recipients, transfers, retention]
      properties:
        activity_id: {$ref: '#/components/schemas/Uuid'}
        activity_code: {type: string}
        activity_name: {type: string}
        activity_description: {type: string}
        role: {$ref: '#/components/schemas/ActivityRole'}
        purposes:
          type: array
          items:
            type: object
            required: [text, lawful_basis_code, lawful_basis_name_th]
            properties:
              text: {type: string}
              lawful_basis_code: {type: string}
              lawful_basis_name_th: {type: string}
              lawful_basis_name_en: {type: string}
        data:
          type: array
          items:
            type: object
            required: [category_name_th, subject_type_name_th, is_sensitive, source]
            properties:
              category_name_th: {type: string}
              category_name_en: {type: string}
              subject_type_name_th: {type: string}
              subject_type_name_en: {type: string}
              is_sensitive: {type: boolean}
              source:
                type: string
                enum: [direct, indirect]
        recipients:
          type: array
          items:
            type: object
            required: [party_name_th, recipient_role]
            properties:
              party_name_th: {type: string}
              party_name_en: {type: string}
              recipient_role: {type: string}
              disclosure_basis: {type: string}
        transfers:
          type: array
          items:
            type: object
            required: [country_name_th, transfer_basis]
            properties:
              country_name_th: {type: string}
              country_name_en: {type: string}
              transfer_basis: {type: string}
              safeguards: {type: string}
        retention:
          type: array
          items:
            type: object
            required: [retention_basis, trigger_event, disposal_method]
            properties:
              category_name_th: {type: string}
              category_name_en: {type: string}
              retention_months: {type: integer}
              retention_basis: {type: string}
              trigger_event: {type: string}
              disposal_method: {type: string}
    ActivityRole:
      type: string
      enum: [controller, processor]
    ActivityStatus:
      type: string
      enum: [draft, pending_approval, active, under_review, ended]
    ProcessingActivityInput:
      type: object
      required: [legal_entity_id, org_unit_id, code, name, role]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 300}
        description: {type: string}
        role: {$ref: '#/components/schemas/ActivityRole'}
        controller_party_id: {$ref: '#/components/schemas/Uuid'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
        rights_and_access: {type: string, maxLength: 4000}
      example:
        legal_entity_id: 00000000-0000-0000-0000-000000000000
        org_unit_id: 00000000-0000-0000-0000-000000000000
        code: HR-01
        name: การจ่ายเงินเดือนพนักงาน
        role: controller
    ProcessingActivityFromTemplateInput:
      type: object
      required: [activity_template_id, legal_entity_id, org_unit_id, code]
      properties:
        activity_template_id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 40}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
      example:
        activity_template_id: 00000000-0000-0000-0000-000000000000
        legal_entity_id: 00000000-0000-0000-0000-000000000000
        org_unit_id: 00000000-0000-0000-0000-000000000000
        code: HR-01
    ProcessingActivityWizardLegalReason:
      type: string
      description: RTG-05's plain-language stand-in for a lawful basis (ม.24/26) — no legal jargon required.
      enum: [consent, contract, law, benefit]
    ProcessingActivityWizardRetention:
      type: string
      description: RTG-05's plain-language stand-in for a retention rule (ม.37(3)).
      enum: [until_withdrawn, contract_plus_1y, five_years, ten_years]
    ProcessingActivityWizardRecipientKind:
      type: string
      description: RTG-05's plain-language stand-in for a recipient role (ม.39). Omit entirely when nothing is shared this round.
      enum: [processor, other_controller, government]
    ProcessingActivityWizardInput:
      type: object
      required: [legal_entity_id, org_unit_id, code, name, purpose, legal_reason, subject_type_id, data_category_ids, retention]
      properties:
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string, maxLength: 40}
        name: {type: string, maxLength: 300, description: 'เรียกกิจกรรมนี้ว่าอะไร'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
        purpose: {type: string, description: 'เก็บข้อมูลนี้ไปทำอะไร'}
        legal_reason: {$ref: '#/components/schemas/ProcessingActivityWizardLegalReason'}
        consent_purpose_id:
          $ref: '#/components/schemas/Uuid'
          description: Required when legal_reason is "consent" (ROPA-06) — a real CON module purpose this activity's consent is collected against.
        subject_type_id: {$ref: '#/components/schemas/Uuid', description: 'ข้อมูลนี้เป็นของใคร'}
        data_category_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Uuid'}
          description: 'เก็บข้อมูลอะไรบ้าง'
        retention: {$ref: '#/components/schemas/ProcessingActivityWizardRetention'}
        recipient_kind: {$ref: '#/components/schemas/ProcessingActivityWizardRecipientKind'}
        recipient_party_id:
          $ref: '#/components/schemas/Uuid'
          description: Required when recipient_kind is set.
        recipient_note: {type: string, maxLength: 2000}
      example:
        legal_entity_id: 00000000-0000-0000-0000-000000000000
        org_unit_id: 00000000-0000-0000-0000-000000000000
        code: HR-02
        name: ระบบติดตามผลงานพนักงาน
        purpose: ใช้ประเมินผลงานประจำปีและพิจารณาปรับตำแหน่ง
        legal_reason: contract
        subject_type_id: 00000000-0000-0000-0000-000000000000
        data_category_ids: [00000000-0000-0000-0000-000000000000]
        retention: contract_plus_1y
    ProcessingActivityBatchFromTemplatesInput:
      type: object
      required: [org_unit_id, activity_template_ids]
      properties:
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        activity_template_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/Uuid'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
      example:
        org_unit_id: 00000000-0000-0000-0000-000000000000
        activity_template_ids:
          - 00000000-0000-0000-0000-000000000000
          - 00000000-0000-0000-0000-000000000001
    ProcessingActivity:
      type: object
      required: [id, legal_entity_id, org_unit_id, code, name, role, status, completeness, row_version, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        legal_entity_id: {$ref: '#/components/schemas/Uuid'}
        org_unit_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        role: {$ref: '#/components/schemas/ActivityRole'}
        controller_party_id: {$ref: '#/components/schemas/Uuid'}
        owner_user_id: {$ref: '#/components/schemas/Uuid'}
        rights_and_access: {type: string}
        status: {$ref: '#/components/schemas/ActivityStatus'}
        completeness:
          type: integer
          description: Percentage of the ม.39 mandatory items that are in place
        ended_at: {$ref: '#/components/schemas/Timestamp'}
        end_reason: {type: [string, 'null'], description: 'ROPA-14: why the activity was ended (active -> ended)'}
        missing_items:
          type: array
          description: Which ม.39 items are still missing — the acceptance criterion (only set by GET one activity)
          items:
            type: string
            enum: [data, purpose, controller, retention, rights_access, recipient_basis, sensitive_consent, transfer_basis]
        row_version: {type: integer}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ActivityVersion:
      type: object
      description: ROPA-13 — one approved round of a processing activity, with a full snapshot of its core fields and every child table at the moment it was approved.
      required: [id, activity_id, version_no, snapshot, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        activity_id: {$ref: '#/components/schemas/Uuid'}
        version_no: {type: integer}
        snapshot:
          type: object
          description: The frozen activity (core fields + purposes/data/retention/recipients/transfers/controls) as of this approval.
        approved_by: {$ref: '#/components/schemas/Uuid'}
        approved_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ActivityVersionDiff:
      type: object
      description: ROPA-13 — one snapshot section that differs between two compared versions.
      required: [section]
      properties:
        section: {type: string}
        before: {}
        after: {}
    ActivityLinkedNotice:
      type: object
      description: ROPA-19 — a notice (PNG-01) composed from this activity.
      required: [id, title, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        status: {type: string}
    ActivityLinkedConsentPurpose:
      type: object
      description: ROPA-19 — one of the activity's own purposes that cites a real consent.purposes row (ROPA-06).
      required: [purpose_id, consent_purpose_id, code, status]
      properties:
        purpose_id: {$ref: '#/components/schemas/Uuid'}
        consent_purpose_id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        status: {type: string}
    ActivityLinks:
      type: object
      description: ROPA-19 — the activity's own "linkage" tab, every other module's record that already points back at it. Data Flow (DFG) is omitted deliberately — its diagram is always computed live off the current RoPA/org/vendor rows, so there is nothing stale to list here.
      required: [notices, consent_purposes]
      properties:
        notices:
          type: array
          items: {$ref: '#/components/schemas/ActivityLinkedNotice'}
        consent_purposes:
          type: array
          items: {$ref: '#/components/schemas/ActivityLinkedConsentPurpose'}
    ActivityPurposeInput:
      type: object
      required: [purpose_text, lawful_basis_code]
      properties:
        purpose_id: {$ref: '#/components/schemas/Uuid'}
        purpose_text: {type: string}
        lawful_basis_code: {type: string, maxLength: 20}
        consent_purpose_id: {$ref: '#/components/schemas/Uuid'}
    ActivityPurpose:
      type: object
