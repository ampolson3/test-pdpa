          type: boolean
          description: A platform template (read-only for tenants; override it by creating your own)
        code:
          type: string
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        language:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    NotificationDelivery:
      type: object
