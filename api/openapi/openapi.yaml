                additionalProperties: true
        language:
          type: string
          enum: [th, en]
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ConsentResult:
      type: object
      required: [receipt_no, subject_ref, transactions]
      properties:
        receipt_no:
          type: string
        subject_ref:
          $ref: '#/components/schemas/Uuid'
        transactions:
          type: array
          items:
            type: object
            required: [id, purpose_code, transaction_type, status]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              purpose_code:
                type: string
              transaction_type:
                type: string
                enum: [CONSENTED, NOT_CONSENTED, WITHDRAWN, EXPIRED, EXTENDED, PENDING, CONFIRMED, CANCELLED, CHANGED_PREFERENCES]
              status:
                type: string
                description: Resulting consent status (ST-01)
                enum: [ACTIVE, NOT_GIVEN, WITHDRAWN, EXPIRED, PENDING]
