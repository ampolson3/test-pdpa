openapi: 3.1.0
info:
  title: PDPA Management Platform API
  version: 0.1.0
  summary: Contract base shared by all surfaces (admin, portal, public, api, scim, webhooks)
  description: |
    Source of truth for the Go handlers (oapi-codegen) and the TypeScript client (openapi-typescript).
    Conventions are in api/openapi/README.md. Every operation must declare `x-permission`
    (`<area>.<resource>.<action>` from docs/security/permissions.yaml, or `public`, `authenticated`, `scim`, `webhook`)
    and `x-module` (the owning Go module / PostgreSQL schema).
    The three operations below are reference examples; add the rest feature by feature.
servers:
  - url: https://api.pdpa.example
    description: Placeholder — the real host is per environment
tags:
  - name: iam
    description: Users, roles, permissions, sessions (backend/internal/iam)
  - name: consent
    description: Purposes, collection points, consent transactions (backend/internal/consent)
  - name: org
    description: Organization — business calendars and holidays so far (backend/internal/org)
  - name: platform
    description: Platform services — background jobs, files, notifications, ... (backend/internal/platform/<service>)
paths:
  /admin/v1/me:
    get:
      operationId: iamGetMe
      tags: [iam]
      summary: Current user, effective permissions and data scopes
      description: Called by the admin BFF after login (SEQ-01). Result is cached per user in Valkey for 60 seconds.
      x-permission: authenticated
      x-module: iam
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 01925f3c-7b8e-7c3a-9d51-2f0c6e1a4b77
                display_name: สมศรี ใจดี
                email_masked: so****@example.co.th
                locale: th
                tenant:
                  id: 01925f3c-0000-7000-8000-000000000001
                  code: acme
                  name: บริษัท ตัวอย่าง จำกัด
                roles: [DPO]
                permissions: [ropa.activity.read, ropa.activity.approve, dsar.request.read]
                scopes:
                  - scope_type: legal_entity
                    legal_entity_id: 01925f3c-0000-7000-8000-0000000000a1
                    org_unit_id: null
                    include_descendants: true
                mfa_enrolled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/jobs:
    get:
      operationId: platformListJobs
      tags: [platform]
      summary: Background jobs of the current tenant (PLT-10 job-status page)
      description: |
        Lists River jobs whose args carry the caller's tenant_id — newest first. Platform-wide jobs
        (no tenant_id) are never listed here; the provider console will show those. Finished jobs are
        kept 24 hours (completed), 24 hours (cancelled) or 7 days (discarded) before River removes them.
      x-permission: admin.job.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          description: Only jobs in these states
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobState'
        - name: kind
          in: query
          required: false
          description: Only jobs of this kind (e.g. `outbox.dispatch`)
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: One page of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
              example:
                data:
                  - id: 18342
                    kind: outbox.dispatch
                    queue: default
                    state: retryable
                    attempt: 2
                    max_attempts: 25
                    created_at: '2026-09-25T03:15:00Z'
                    scheduled_at: '2026-09-25T03:15:17Z'
                    attempted_at: '2026-09-25T03:15:01Z'
                    finalized_at: null
                    last_error: 'webhook endpoint returned 503'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/platform/files:
    post:
      operationId: platformUploadFile
      tags: [platform]
      summary: Upload a file (PLT-09)
      description: |
        Stores the file and queues its ClamAV scan; the file is downloadable only once `av_status` is `clean`.
        Size and type are checked against the file's content, not the declared type. An upload that is not
        attached to a record by the owning module within 24 hours is deleted. Only the uploader can see an
        unattached file.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored; scan pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
              example:
                id: 01925f3c-7b8e-7c3a-9d51-2f0c6e1a4b99
                file_name: หนังสือมอบอำนาจ.pdf
                mime_type: application/pdf
                size_bytes: 182044
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                av_status: pending
                created_at: '2026-09-25T03:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File larger than the configured limit (`files.too_large`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: File type not allowed (`files.type_not_allowed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/v1/platform/files/{id}:
    get:
      operationId: platformGetFile
      tags: [platform]
      summary: File metadata and scan status
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/files/{id}/download:
    get:
      operationId: platformDownloadFile
      tags: [platform]
      summary: Redirect to a short-lived signed download URL (SEQ-07)
      description: |
        302 to a pre-signed object-storage URL that expires after 5 minutes (configurable) and always downloads
        as an attachment. 409 while the scan is pending (`files.scan_pending`), for an infected file
        (`files.infected`) or a failed scan (`files.scan_failed`). Visibility: the uploader while unattached;
        once attached, users holding the permission the owning module registered for that record type.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '302':
          description: Signed URL
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/v1/platform/notification-templates:
    get:
      operationId: platformListNotificationTemplates
      tags: [platform]
      summary: Notification templates visible to the tenant (its own and the platform's global ones)
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: platformCreateNotificationTemplate
      tags: [platform]
      summary: Create a tenant template (or override a global one with the same code, channel and language)
      x-permission: admin.notification.create
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplateInput'
            example:
              code: dsar.received
              channel: email
              language: th
              subject: ได้รับคำขอ {{.request_no}}
              body: เรียน {{.name}} เราได้รับคำขอ {{.request_no}} แล้ว
              variables: [name, request_no]
      responses:
        '201':
          description: Created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/notification-templates/preview:
    post:
      operationId: platformPreviewNotificationTemplate
      tags: [platform]
      summary: Render a template with sample values (declared variables not given show as {name})
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                body:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
                values:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Rendered
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  subject:
                    type: string
                  body:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/notification-templates/{id}:
    get:
      operationId: platformGetNotificationTemplate
      tags: [platform]
      summary: One template
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The template
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: platformUpdateNotificationTemplate
      tags: [platform]
      summary: Change subject, body and variables of a tenant template (global templates are read-only)
      x-permission: admin.notification.update
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                body:
                  type: string
                variables:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      operationId: platformDeleteNotificationTemplate
      tags: [platform]
      summary: Delete a tenant template
      x-permission: admin.notification.delete
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/v1/platform/notifications:
    get:
      operationId: platformListNotifications
      tags: [platform]
      summary: Delivery log — status of every message, newest first (PLT-04)
      description: Recipients are masked; message text and variables are never returned.
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/v1/platform/notifications/{id}:
    get:
      operationId: platformGetNotification
      tags: [platform]
      summary: Delivery status of one message
      x-permission: admin.notification.read
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The message's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/inbox:
    get:
      operationId: platformGetInbox
      tags: [platform]
      summary: The signed-in user's in-app notifications and unread count (the bell)
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/inbox/stream:
    get:
      operationId: platformStreamInbox
      tags: [platform]
      summary: Server-sent events with the unread count whenever it changes
      description: |
        `text/event-stream`; each event is `event: unread` with data `{"unread": <n>}`, sent on connect and on
        every change (checked every few seconds), plus a comment line as keep-alive. Reconnect with EventSource.
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/v1/platform/inbox/{id}/read:
    post:
      operationId: platformMarkInboxRead
      tags: [platform]
      summary: Mark one of the user's own in-app notifications read
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Marked read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/records/{entityType}/{entityId}/comments:
    get:
      operationId: platformListComments
      tags: [platform]
      summary: Comments of a record, oldest first (PLT-07)
      description: Allowed when the record type is registered by its module and the caller holds that module's read (list) or write (post) permission for it — deny by default (PLT-07).
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: platformCreateComment
      tags: [platform]
      summary: Comment on a record, or reply (parent_id); @mentions notify their users
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
                  description: 'Mentions are written as @[Display name](user-id)'
                parent_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/records/{entityType}/{entityId}/attachments:
    get:
      operationId: platformListAttachments
      tags: [platform]
      summary: Files attached to a record
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: platformAttachFile
      tags: [platform]
      summary: Attach a file the caller uploaded (POST /admin/v1/platform/files) to a record
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/platform/records/{entityType}/{entityId}/activity:
    get:
      operationId: platformListActivity
      tags: [platform]
      summary: Activity timeline of a record (its audit trail), newest first
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/platform/comments/{id}:
    patch:
      operationId: platformUpdateComment
      tags: [platform]
      summary: Edit your own comment
      x-permission: authenticated
      x-module: platform
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 20000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
