                      maxItems: 5
                      items:
                        $ref: '#/components/schemas/SubjectIdentifier'
                    is_minor:
                      type: boolean
                      description: Self-declared (ม.20, CON-11) — when true, a CONSENTED decision on a purpose with min_age set records PENDING until the guardian confirms their own OTP.
                    guardian:
                      type: object
                      required:
                      - identifiers
                      - relationship
                      properties:
                        identifiers:
                          type: array
                          minItems: 1
                          maxItems: 3
                          items:
                            $ref: '#/components/schemas/SubjectIdentifier'
                        relationship:
                          type: string
                          enum: [parent, legal_guardian, curator, custodian]
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ConsentDecisionInput'
                language:
                  type: string
                  enum:
                  - th
                  - en
                verification:
                  type: object
                  description: Required when the collection point's verification_method is "otp" (CON-19) — the id from consentStartVerification plus the code the subject was sent, for one of the identifiers above.
                  required: [verification_id, code]
                  properties:
                    verification_id:
                      $ref: '#/components/schemas/Uuid'
                    code:
                      type: string
                      pattern: ^[0-9]{6}$
