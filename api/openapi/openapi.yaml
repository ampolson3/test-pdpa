    BusinessCalendar:
      type: object
      required: [id, name, timezone, workdays, is_default, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        timezone:
          type: string
        workdays:
          type: array
          items:
            type: integer
        is_default:
          type: boolean
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Holiday:
