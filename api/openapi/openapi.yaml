              required:
                type: boolean
        total_rows:
          type: [integer, 'null']
        valid_rows:
          type: [integer, 'null']
        error_rows:
          type: [integer, 'null']
        has_error_report:
          type: boolean
        failure:
          type: string
          description: file_rejected, file_unreadable, no_header_row, apply_failed_line_<n>
        row_version:
