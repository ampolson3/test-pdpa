  /api/v1/consents:
    post:
      operationId: consentSubmitConsents
      tags: [consent]
      summary: Record consent decisions from a channel system (CRM / POS / app)
      description: |
        SEQ-04. One receipt per call, one consent transaction per purpose decision, consent status projection updated and
        `consent.*` events written to the outbox in the same transaction. Replaying the same Idempotency-Key with the same
        body returns the stored status and body (201) with `Idempotent-Replayed: true`.
      x-permission: consent.record.create
      x-module: consent
      security:
        - clientCredentials: [consent.record.create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentSubmission'
            example:
              collection_point_code: CRM-MEMBER
              subject:
                identifiers:
                  - type: email
                    value: customer@example.com
              decisions:
                - purpose_code: MARKETING-EMAIL
                  purpose_version_no: 3
                  decision: CONSENTED
                  preferences:
                    frequency: weekly
                - purpose_code: PROFILING
                  purpose_version_no: 1
                  decision: NOT_CONSENTED
              language: th
              occurred_at: '2026-09-25T03:15:00Z'
      responses:
        '201':
          description: Recorded (also returned, with Idempotent-Replayed, when an identical request is replayed)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token attached server-side by the admin BFF. Browsers never hold it.
    portalToken:
      type: http
      scheme: bearer
      description: Short-lived token issued by the API after OTP / ThaID verification (idle 30 minutes), kept by the portal BFF.
    guestToken:
      type: http
      scheme: bearer
      description: Session issued after a guest link token plus e-mail OTP; bound to one task (IAM-04).
    clientCredentials:
      type: oauth2
      description: OAuth2 client credentials via Keycloak (single realm, tenant in the `tid` claim — decisions Q-18), access token at most 15 minutes. Scopes are permission codes (decisions Q-10).
      flows:
        clientCredentials:
          tokenUrl: https://auth.pdpa.example/realms/pdpa/protocol/openid-connect/token
          scopes:
            consent.record.create: Record consent decisions
            consent.record.read: Read consent status of data subjects
            dsar.request.create: Submit data subject requests
            breach.incident.create: Report incidents (SIEM)
    scimBearer:
      type: http
      scheme: bearer
      description: SCIM 2.0 bearer token per tenant
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 't=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + body)>; reject if older than 5 minutes'
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: Record type registered by its module (e.g. notification_template, dsar_request)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,59}$'
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended). Kept 24 hours per tenant and principal. Missing → 428 (the validator maps it).
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (row_version) of the resource being modified. Mismatch → 412, missing → 428.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields; prefix with `-` for descending (e.g. `-created_at`)
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of messages and localized fields (default th)
      schema:
        type: string
        enum: [th, en]
        default: th
  headers:
    ETag:
      description: Current row_version of the resource
      schema:
        type: string
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier request with the same Idempotency-Key
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or schema validation failure (`request.invalid`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials (`authn.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (`authz.denied`) — also written to iam.security_events
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible in this tenant / scope (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state (`<module>.invalid_transition`, `idempotency.in_progress`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current row_version (`conflict.version_mismatch`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required Idempotency-Key or If-Match header missing (`precondition.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business rule violation (`<module>.<rule>`, `idempotency.key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FormText:
      type: object
      description: Text by language; th is required
      required: [th]
      additionalProperties: false
      properties:
        th:
          type: string
          maxLength: 2000
        en:
          type: string
          maxLength: 2000
    FormCondition:
      type: object
      description: Show when an earlier question's answer compares true (question + op + value), or all/any of nested conditions
      additionalProperties: false
      properties:
        question:
          type: string
          maxLength: 60
        op:
          type: string
          enum: [eq, neq, in, not_in, gt, gte, lt, lte, answered, not_answered]
        value: {}
        all:
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
        any:
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
    FormOption:
      type: object
      description: A choice; label is required except on yes_no questions (whose options only carry scores)
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          maxLength: 60
        label:
          $ref: '#/components/schemas/FormText'
        score:
          type: number
