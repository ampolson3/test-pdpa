        assignee_group_id:
          $ref: '#/components/schemas/Uuid'
        group_name:
          type: string
        status:
          type: string
          enum: [open, in_progress, done, cancelled]
        due_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        outcome:
          type: string
        comment:
          type: string
        row_version:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    MyTask:
      allOf:
        - $ref: '#/components/schemas/WorkflowTask'
        - type: object
