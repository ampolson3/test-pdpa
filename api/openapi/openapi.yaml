          $ref: '#/components/responses/NotFound'
    post:
      operationId: cookieCreateScriptRule
      tags: [cookie]
      summary: Declare a script's own category — the acceptance criterion's own enforcement mechanism (CON-02)
      x-permission: cookie.banner.create
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieCreateScriptRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieScriptRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/cookie/script-rules/{id}:
    delete:
      operationId: cookieDeleteScriptRule
      tags: [cookie]
      summary: Remove a script rule (CON-02)
      x-permission: cookie.banner.delete
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/cookie/domains/{id}/scans:
    get:
      operationId: cookieListScans
      tags: [cookie]
      summary: Automated cookie-scan rounds for a domain, newest first (CON-04)
      x-permission: cookie.scan.read
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookieScan'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: cookieStartScan
      tags: [cookie]
      summary: Start a new scan round against a domain's own live site (CON-04)
      description: |
        Always scans fresh and pre-consent — the crawl runs with no visitor decision recorded, matching
        the acceptance criterion's own "สแกนก่อนขอความยินยอม". Running (status=queued/running) is enqueued
        to cookie.scan; cmd/worker's own ScanWorker (the only process with a real cookiescan.Crawler) does
        the actual crawl.
      x-permission: cookie.scan.create
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trigger:
                  type: string
                  enum: [manual, schedule, publish]
                  default: manual
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/v1/cookie/scans/{id}:
    get:
      operationId: cookieGetScan
      tags: [cookie]
      summary: One scan round's own status/counters (CON-04)
      x-permission: cookie.scan.read
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/cookie/scans/{id}/findings:
    get:
      operationId: cookieListScanFindings
      tags: [cookie]
      summary: Every cookie this scan round observed, one row per page it was seen on (CON-04)
      x-permission: cookie.scan.read
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookieScanFinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/cookie/scan-findings/{id}/classify:
    post:
      operationId: cookieClassifyScanFinding
      tags: [cookie]
      summary: Correct or confirm an unknown scanned cookie's category (CON-04)
      x-permission: cookie.scan.update
      x-module: cookie
      security:
        - adminJwt: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              additionalProperties: false
              properties:
                category_id: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieScanFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /public/v1/cookie-banners/{key}:
    get:
      operationId: cookieGetPublicBanner
      tags: [cookie]
      summary: The published banner + categories for this domain, no login (CON-01)
      description: |
        Tenant is resolved from `key` through platform.public_keys before the tenant transaction starts
        (ADR-19, same mechanism as every other /public/v1 surface). A domain with no published banner yet
        reads as 404, same as an unknown key.
      x-permission: public
      x-module: cookie
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,64}$'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookiePublicBanner'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/v1/cookie-banners/{key}/policy:
    get:
      operationId: cookieGetPublicPolicy
      tags: [cookie]
      summary: The Cookie Policy table for this domain, no login (CON-05)
      description: |
        A live read of every active cookie catalogued for this domain (CON-02's own manual entries plus
        CON-04's own scanner-found ones), each with its category name — so the table always matches the
        latest scan with no separate snapshot to go stale. Tenant is resolved from `key` the same way as
        the published-banner endpoint; a domain with no published banner yet reads as 404.
      x-permission: public
      x-module: cookie
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,64}$'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookiePublicPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/v1/cookie-banners/{key}/consents:
    post:
      operationId: cookieSubmitConsent
      tags: [cookie]
      summary: Record a visitor's banner decision — the acceptance criterion itself (CON-01)
      description: One call records accept_all, reject_all or a custom per-category choice — reject-all is exactly one click, the same weight as accept-all.
      x-permission: public
      x-module: cookie
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{22,64}$'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookieSubmitConsentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token attached server-side by the admin BFF. Browsers never hold it.
    portalToken:
      type: http
      scheme: bearer
      description: Short-lived token issued by the API after OTP / ThaID verification (idle 30 minutes), kept by the portal BFF.
    guestToken:
      type: http
      scheme: bearer
      description: Session issued after a guest link token plus e-mail OTP; bound to one task (IAM-04).
    clientCredentials:
      type: oauth2
      description: OAuth2 client credentials via Keycloak (single realm, tenant in the `tid` claim — decisions Q-18), access token at most 15 minutes. Scopes are permission codes (decisions Q-10).
      flows:
        clientCredentials:
          tokenUrl: https://auth.pdpa.example/realms/pdpa/protocol/openid-connect/token
          scopes:
            consent.record.create: Record consent decisions
            consent.record.read: Read consent status of data subjects
            dsar.request.create: Submit data subject requests
            breach.incident.create: Report incidents (SIEM)
    scimBearer:
      type: http
      scheme: bearer
      description: SCIM 2.0 bearer token per tenant
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 't=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + body)>; reject if older than 5 minutes'
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: Record type registered by its module (e.g. notification_template, dsar_request)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,59}$'
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (UUID recommended). Kept 24 hours per tenant and principal. Missing → 428 (the validator maps it).
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (row_version) of the resource being modified. Mismatch → 412, missing → 428.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields; prefix with `-` for descending (e.g. `-created_at`)
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of messages and localized fields (default th)
      schema:
        type: string
        enum: [th, en]
        default: th
  headers:
    ETag:
      description: Current row_version of the resource
      schema:
        type: string
    IdempotentReplayed:
      description: Present and `true` when the response is a replay of an earlier request with the same Idempotency-Key
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or schema validation failure (`request.invalid`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials (`authn.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (`authz.denied`) — also written to iam.security_events
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible in this tenant / scope (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state (`<module>.invalid_transition`, `idempotency.in_progress`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current row_version (`conflict.version_mismatch`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required Idempotency-Key or If-Match header missing (`precondition.required`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business rule violation (`<module>.<rule>`, `idempotency.key_reused`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FormText:
      type: object
      description: Text by language; th is required
      required: [th]
      additionalProperties: false
      properties:
        th:
          type: string
          maxLength: 2000
        en:
          type: string
          maxLength: 2000
    FormCondition:
      type: object
      description: Show when an earlier question's answer compares true (question + op + value), or all/any of nested conditions
      additionalProperties: false
      properties:
        question:
          type: string
          maxLength: 60
        op:
          type: string
          enum: [eq, neq, in, not_in, gt, gte, lt, lte, answered, not_answered]
        value: {}
        all:
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
        any:
          type: array
          items:
            $ref: '#/components/schemas/FormCondition'
    FormOption:
      type: object
      description: A choice; label is required except on yes_no questions (whose options only carry scores)
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          maxLength: 60
        label:
          $ref: '#/components/schemas/FormText'
        score:
          type: number
    FormQuestion:
      type: object
      required: [key, type, label]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
        type:
          type: string
          enum: [text, textarea, number, date, email, single_choice, multi_choice, yes_no]
        label:
          $ref: '#/components/schemas/FormText'
        help:
          $ref: '#/components/schemas/FormText'
        required:
          type: boolean
        options:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FormOption'
        min:
          type: number
        max:
          type: number
        max_length:
          type: integer
          minimum: 0
        weight:
          type: number
        visible_if:
          $ref: '#/components/schemas/FormCondition'
    FormSection:
      type: object
      required: [key, title, questions]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,59}$'
        title:
          $ref: '#/components/schemas/FormText'
        description:
          $ref: '#/components/schemas/FormText'
        visible_if:
          $ref: '#/components/schemas/FormCondition'
        questions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FormQuestion'
    FormSchema:
      type: object
      description: A form's content (PLT-06 format, docs/modules/PLT.md#plt-06)
      required: [sections]
      additionalProperties: false
      properties:
        sections:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FormSection'
    FormScoring:
      type: object
      required: [bands]
      additionalProperties: false
      properties:
        bands:
          type: array
          maxItems: 20
          items:
            type: object
            required: [key, label, min]
            additionalProperties: false
            properties:
              key:
                type: string
                pattern: '^[a-z][a-z0-9_]{0,59}$'
              label:
                $ref: '#/components/schemas/FormText'
              min:
                type: number
              max:
                type: number
    FormDraft:
      type: object
      required: [schema]
      additionalProperties: false
      properties:
        schema:
          $ref: '#/components/schemas/FormSchema'
        scoring:
          $ref: '#/components/schemas/FormScoring'
        languages:
          type: array
          items:
            type: string
            enum: [th, en]
    FormTypeInfo:
      type: object
      required: [form_type, can_create, can_update, can_publish, can_respond]
      properties:
        form_type:
          type: string
        can_create:
          type: boolean
        can_update:
          type: boolean
        can_publish:
          type: boolean
        can_respond:
          type: boolean
    FormSummary:
      type: object
      required: [id, global, code, name, form_type, status, latest_version, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        global:
          type: boolean
          description: A platform form every tenant can use (read-only here)
        code:
          type: string
        name:
          type: string
        form_type:
          type: string
        status:
          type: string
          enum: [draft, published, retired]
        current_version_id:
          $ref: '#/components/schemas/Uuid'
        latest_version:
          type: integer
        row_version:
          type: integer
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    FormVersion:
      type: object
      required: [id, form_id, version, schema, languages, row_version, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        form_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
        schema:
          $ref: '#/components/schemas/FormSchema'
        scoring:
          $ref: '#/components/schemas/FormScoring'
        languages:
          type: array
          items:
            type: string
        published_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
          description: The draft's ETag value (If-Match for saving and publishing it)
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Form:
      allOf:
        - $ref: '#/components/schemas/FormSummary'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: '#/components/schemas/FormVersion'
    FormAnswers:
      type: object
      description: Answers by question key (string, number, or an array of option values for multi_choice)
      additionalProperties: {}
    FormResult:
      type: object
      required: [visible, answers, errors, score, max_score]
      properties:
        visible:
          type: array
          items:
            type: string
        answers:
          $ref: '#/components/schemas/FormAnswers'
        errors:
          type: array
          items:
            type: object
            required: [question, code]
            properties:
              question:
                type: string
              code:
                type: string
                enum: [required, invalid_type, invalid_option, out_of_range, too_long, invalid_date, invalid_email, unknown_question]
        score:
          type: number
        max_score:
          type: number
        band:
          type: string
    FormSectionAssignment:
      type: object
      required: [id, section, assignee_user_id, assignee_name, status, row_version]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        section:
          type: string
        assignee_user_id:
          $ref: '#/components/schemas/Uuid'
        assignee_name:
          type: string
        status:
          type: string
          enum: [open, done]
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
    FormResponseSummary:
      type: object
      required: [id, status, row_version, result]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [draft, submitted]
        owner_id:
          $ref: '#/components/schemas/Uuid'
        owner_name:
          type: string
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        row_version:
          type: integer
        result:
          $ref: '#/components/schemas/FormResult'
    FormResponse:
      allOf:
        - $ref: '#/components/schemas/FormResponseSummary'
        - type: object
          required: [form, version, answers, assignments, can_answer, is_owner]
          properties:
            form:
              $ref: '#/components/schemas/FormSummary'
            version:
              $ref: '#/components/schemas/FormVersion'
            entity_type:
              type: string
            entity_id:
              $ref: '#/components/schemas/Uuid'
            answers:
              $ref: '#/components/schemas/FormAnswers'
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/FormSectionAssignment'
            can_answer:
              type: array
              description: Sections the caller may answer now
              items:
                type: string
            is_owner:
              type: boolean
    FormSectionAssignmentItem:
      type: object
      required: [response_id, form_id, form_name, form_type, section, section_title, created_at]
      properties:
        response_id:
          $ref: '#/components/schemas/Uuid'
        form_id:
          $ref: '#/components/schemas/Uuid'
        form_name:
          type: string
        form_type:
          type: string
        section:
          type: string
        section_title:
          $ref: '#/components/schemas/FormText'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    VersionChange:
      type: object
      required: [path]
