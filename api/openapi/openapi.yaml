        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: decisions[0].purpose_code
        code:
          type: string
          example: required
        message:
          type: string
    Me:
      type: object
