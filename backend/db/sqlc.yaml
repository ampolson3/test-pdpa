version: "2"
sql:
  - schema: "migrations"
    queries: "queries/iam"
    engine: postgresql
    gen:
      go:
        package: "iamstore"
        out: "../internal/iam/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "citext"
            go_type: "string"
